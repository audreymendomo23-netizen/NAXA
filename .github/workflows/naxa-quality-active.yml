          from pathlib import Path
          import re
          files=[
            Path("supabase/migration_028_promoteur_responsable_accreditation.sql"),
            Path("supabase/migration_029_promoteur_caisse_management.sql"),
            Path("supabase/migration_030_promoteur_delegation_validity.sql"),
            Path("supabase/migration_031_promoteur_caisse_elevation_validity.sql"),
            Path("supabase/migration_032_promoteur_scope_pilotage.sql"),
            Path("supabase/migration_033_caisse_reactivation_authorization.sql"),
          ]
          missing=[]
          for p in files:
            if not p.exists():
              missing.append(str(p))
          if missing:
            raise SystemExit("Migrations attendues absentes: "+", ".join(missing))
          forbidden=["grant all privileges to authenticated","grant all on schema public to authenticated"]
          for p in files:
            t=p.read_text().lower()
            for x in forbidden:
              if x in t:
                raise SystemExit(f"Élargissement de privilèges détecté dans {p}: {x}")
          print("Anti-régression structurelle: PASS")
          print("Aucune migration Promoteur contrôlée n'élargit globalement les privilèges authenticated.")
          PY


  verification-11-session-audit:
    needs: verification-10-security-regression
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Configurer Supabase local
        run: |
          cat > supabase/config.toml <<'EOF'
          project_id = "naxa-verification-11-session-audit"
          [api]
          enabled = true
          [db]
          major_version = 17
          [studio]
          enabled = false
          [inbucket]
          enabled = false
          [storage]
          enabled = true
          [realtime]
          enabled = false
          [analytics]
          enabled = false
          [edge_runtime]
          enabled = false
          EOF
      - name: Préparer le replay historique
        run: |
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          cp supabase/schema.sql supabase/migrations/20261006000000_base.sql
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("supabase/migrations/20261006000000_base.sql")
          s=p.read_text()
          a=s.index("create or replace function handle_new_user")
          b=s.index("then raise exception 'Nom d''utilisateur invalide'",a)
          handle=r"""create or replace function handle_new_user() returns trigger language plpgsql security definer set search_path=public as $fn$
          declare
            v_username text:=lower(trim(new.raw_user_meta_data->>'username')); v_first_name text:=trim(new.raw_user_meta_data->>'first_name'); v_last_name text:=trim(new.raw_user_meta_data->>'last_name'); v_phone text:=trim(new.raw_user_meta_data->>'phone'); v_country text:=upper(trim(new.raw_user_meta_data->>'phone_country')); v_dob date:=(new.raw_user_meta_data->>'date_of_birth')::date; v_consent boolean:=coalesce((new.raw_user_meta_data->>'consent_accepted')::boolean,false);
          begin
            if v_username is null or v_username !~ '^[a-z0-9][a-z0-9._-]{2,29}$' then raise exception 'Nom d''utilisateur invalide'; end if;
            if exists(select 1 from public.profiles where lower(username)=v_username) then raise exception 'Nom d''utilisateur déjà pris'; end if;
            if v_first_name is null or length(v_first_name)<2 or length(v_first_name)>80 then raise exception 'Prénom invalide'; end if;
            if v_last_name is null or length(v_last_name)<2 or length(v_last_name)>80 then raise exception 'Nom invalide'; end if;
            if v_dob is null or v_dob>current_date or extract(year from age(current_date,v_dob))<18 then raise exception 'NAXA est réservé aux personnes âgées de 18 ans ou plus'; end if;
            if not v_consent then raise exception 'L''acceptation des conditions est obligatoire'; end if;
            insert into public.profiles(id,role,username,first_name,last_name,phone,phone_country,date_of_birth,age_verified,consent_accepted_at) values(new.id,'client',v_username,v_first_name,v_last_name,v_phone,v_country,v_dob,true,now()); return new;
          end; $fn$;
          """
          s=s[:a]+handle+s[s.index("create trigger on_auth_user_created",a):b]
          a=s.index("create or replace function reserve_stock"); b=s.index("revoke execute on function restore_stock",a)
          reserve=s[a:b].replace("as $declare","as $fn$ declare").replace("end$;","end$fn$;")
          s=s[:a]+reserve+s[b:]
          a=s.index("create or replace function my_pharmacie"); b=s.index("alter table profiles",a)
          s=s[:a]+"""create or replace function my_pharmacie() returns uuid language sql stable security definer set search_path=public as $fn$ select pharmacie_id from profiles where id=auth.uid() and actif=true and role in ('pharmacie','promoteur','caisse'); $fn$;
          """+s[b:]
          s=re.sub(r"insert into storage\.buckets\s*\([^;]*?\)\s*values\s*\([^;]*?\);\s*","",s,flags=re.I|re.S)
          s=re.sub(r"revoke execute on function (restore_stock|expire_reservations)\([^;]*\) from public,anon,authenticated;\s*","",s)
          p.write_text(s)
          PY
          n=1
          for f in supabase/migration_*.sql; do ts=$(printf '2026100600%02d' "$n"); cp "$f" "supabase/migrations/${ts}_$(basename "$f")"; n=$((n+1)); done
      - name: Démarrer Supabase local
        run: supabase start
      - name: Replay complet
        run: supabase db reset
      - name: Audit sessions Promoteur — structure + sécurité
        run: docker exec -i supabase_db_naxa-verification-11-session-audit psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/034_promoteur_session_audit.sql
      - name: Audit sessions Promoteur — comportement réel 4→5
        run: docker exec -i supabase_db_naxa-verification-11-session-audit psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/035_promoteur_session_audit_behavior.sql
      - name: Audit sessions Promoteur — cloisonnement RLS
        run: docker exec -i supabase_db_naxa-verification-11-session-audit psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/036_promoteur_session_audit_rls.sql
      - name: Arrêt Supabase
        if: always()
        run: supabase stop
