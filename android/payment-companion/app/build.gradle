plugins {
    id "com.android.application"
}

android {
    namespace "cm.naxa.paymentcompanion"
    compileSdk 36
    defaultConfig {
        applicationId "cm.naxa.paymentcompanion"
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName "1.2.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
