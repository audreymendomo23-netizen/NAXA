name: Android native build

on:
  push:
    branches: [main]
    paths:
      - "android/app/**"
      - "android/payment-companion/**"
      - ".github/workflows/android-native-build.yml"
  pull_request:
    paths:
      - "android/app/**"
      - "android/payment-companion/**"
      - ".github/workflows/android-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxa-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-app:
    name: NAXA main app · Compose · tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://build-test.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'build-test-anon-key' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable dans $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9 (AGP 8.7.3)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      - name: Compile, test and assemble NAXA main app
        working-directory: android
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Publish internal main-app debug APK
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: naxa-main-app-debug-internal
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  main-app-emulator:
    name: NAXA main app · Android emulator integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9 (AGP 8.7.3)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run encrypted queue and WorkManager tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            test -n "$SUPABASE_URL"
            test -n "$SUPABASE_ANON_KEY"
            cd android
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Publish emulator instrumentation reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: naxa-android-emulator-instrumentation-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

  payment-companion:
    name: Payment companion · standard + professional + admin
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable dans $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0 (AGP 9.4.0)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.6.0"

      - name: Compile, test and assemble all private variants
        working-directory: android/payment-companion
        run: |
          gradle --no-daemon --stacktrace \
            :app:testStandardDebugUnitTest :app:assembleStandardDebug \
            :app:testProfessionalDebugUnitTest :app:assembleProfessionalDebug \
            :app:testAdminDebugUnitTest :app:assembleAdminDebug

      - name: Verify profile permissions and native capture components
        shell: bash
        run: |
          set -euo pipefail
          AAPT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools/36.0.0/aapt"
          APK_ROOT="android/payment-companion/app/build/outputs/apk"
          check_variant() {
            local variant="$1"
            local expect_capture="$2"
            local apk="$APK_ROOT/$variant/debug/app-$variant-debug.apk"
            test -s "$apk"
            local permissions manifest
            permissions="$("$AAPT" dump permissions "$apk")"
            manifest="$("$AAPT" dump xmltree "$apk" AndroidManifest.xml)"
            if [ "$expect_capture" = "yes" ]; then
              grep -q "android.permission.RECEIVE_SMS" <<<"$permissions"
              grep -q "SmsReceiver" <<<"$manifest"
              grep -q "NaxaNotificationListenerService" <<<"$manifest"
            else
              if grep -q "android.permission.RECEIVE_SMS" <<<"$permissions"; then
                echo "RECEIVE_SMS interdit dans la variante $variant" >&2
                exit 1
              fi
              if grep -q "SmsReceiver\|NaxaNotificationListenerService" <<<"$manifest"; then
                echo "Composant de capture interdit dans la variante $variant" >&2
                exit 1
              fi
            fi
            echo "Manifest profile check PASS: $variant"
          }
          check_variant standard no
          check_variant professional yes
          check_variant admin yes

      - name: Publish private debug APKs only
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: naxa-payment-companion-private-debug-variants
          path: |
            android/payment-companion/app/build/outputs/apk/standard/debug/app-standard-debug.apk
            android/payment-companion/app/build/outputs/apk/professional/debug/app-professional-debug.apk
            android/payment-companion/app/build/outputs/apk/admin/debug/app-admin-debug.apk
          if-no-files-found: error
          retention-days: 7
