name: NAXA navigation Promoteur E2E Replay
# Replay regression gate: includes Client purchase-history HTTP 400 assertion.
run-name: NAXA navigation Promoteur E2E Replay — ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/naxa-nav-promoteur-e2e.yml"
      - ".github/e2e/naxa-navigation-runtime.cjs"
      - "scripts/e2e/verify-promoteur-navigation-browser.cjs"
      - "scripts/test-promoteur-navigation-browser.cjs"
      - "src/app/pharmacie/promoteur/layout.tsx"
      - "src/app/pharmacie/promoteur/livraisons/page.tsx"
      - "src/components/pharmacie/NavPromoteur.tsx"
      - "src/middleware.ts"
      - "src/app/api/pharmacies/gardes/route.ts"
      - "src/components/BottomNav.tsx"
      - "src/components/AccueilClient.tsx"
      - "src/app/client/profil/page.tsx"
      - "src/app/client/historique/page.tsx"
      - "src/app/resultats/page.tsx"
      - "src/app/panier/page.tsx"
      - "src/lib/panier.tsx"
      - "src/app/commande/nouvelle/page.tsx"
      - "src/app/commande/bebe-maman/page.tsx"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxa-replay-promoteur-secret-safe-v2
  cancel-in-progress: false

jobs:
  browser-navigation:
    name: Navigation Promoteur — Chromium sur Replay
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NAXA_STORAGE_E2E_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NAXA_STORAGE_E2E_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.NAXA_STORAGE_E2E_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NAXA_STORAGE_E2E_ADMIN_KEY }}
      NAXA_STORAGE_E2E_URL: ${{ secrets.NAXA_STORAGE_E2E_URL }}
      NAXA_STORAGE_E2E_ANON_KEY: ${{ secrets.NAXA_STORAGE_E2E_ANON_KEY }}
      NAXA_STORAGE_E2E_ADMIN_KEY: ${{ secrets.NAXA_STORAGE_E2E_ADMIN_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Vérifier que les secrets ciblent Replay
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NAXA_STORAGE_E2E_URL"
          test -n "$NAXA_STORAGE_E2E_ANON_KEY"
          test -n "$NAXA_STORAGE_E2E_ADMIN_KEY"
          test "$NAXA_STORAGE_E2E_URL" = "https://pwfftcsjyeibxxqhwysw.supabase.co"
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Construire NAXA avec la configuration Replay
        run: npm run build
      - name: Démarrer le serveur local de test
        shell: bash
        run: |
          set -euo pipefail
          # These variables must exist before launching next-server so the child inherits them.
          export SUPABASE_SECRET_KEY="$NAXA_STORAGE_E2E_ADMIN_KEY"
          test -n "$SUPABASE_SECRET_KEY"
          echo "::add-mask::$SUPABASE_SECRET_KEY"
          NAXA_RATE_LIMIT_SECRET="$(openssl rand -hex 32)"
          export NAXA_RATE_LIMIT_SECRET
          test "${#NAXA_RATE_LIMIT_SECRET}" -ge 32
          echo "::add-mask::$NAXA_RATE_LIMIT_SECRET"
          npm start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/naxa-nav-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/naxa-nav-server.pid"
          ready=0
          for _ in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:3000/connexion >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/naxa-nav-server.log"
            echo "::error::Le serveur local NAXA n'a pas démarré."
            exit 1
          fi
      - name: Recette navigateur Promoteur, Comptable, Partenaire et Client
        env:
          NAXA_E2E_WEB_BASE_URL: http://127.0.0.1:3000
          NAXA_E2E_ALLOW_TEMP_FIXTURES: "true"
        run: node .github/e2e/naxa-navigation-runtime.cjs
      - name: Nettoyage de secours des fixtures Replay
        if: always()
        run: node .github/e2e/naxa-navigation-runtime.cjs --cleanup
      - name: Logs serveur Next.js en cas d'échec
        if: failure()
        shell: bash
        run: |
          echo "::group::Logs serveur Next.js — diagnostic navigation"
          tail -n 120 "$RUNNER_TEMP/naxa-nav-server.log" || true
          echo "::endgroup::"
      - name: Arrêter le serveur local
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/naxa-nav-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/naxa-nav-server.pid")" 2>/dev/null || true
          fi
