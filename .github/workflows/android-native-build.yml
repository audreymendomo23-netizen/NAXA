name: Android native build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-native-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable dans $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile app and run unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Publish debug APK for internal verification only
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: naxa-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
