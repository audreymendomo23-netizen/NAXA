plugins {
    id "com.android.application"
}

android {
    namespace "cm.naxa.paymentcompanion"
    compileSdk 37

    defaultConfig {
        applicationId "cm.naxa.paymentcompanion"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}
