name: NAXA independent database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: naxa-independent-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NAXA_BACKUP_S3_BUCKET: ${{ secrets.NAXA_BACKUP_S3_BUCKET }}
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NAXA_DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.NAXA_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "::error::Missing NAXA_DATABASE_URL repository secret"; exit 1; }
          test -n "$ENCRYPTION_KEY" || { echo "::error::Missing NAXA_BACKUP_ENCRYPTION_KEY repository secret"; exit 1; }
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::NAXA_DATABASE_URL must be a PostgreSQL connection URI"; exit 1 ;;
          esac

      - name: Validate PostgreSQL URI without exposing credentials
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NAXA_DATABASE_URL }}
          PROJECT_REF: eouwtuusnsuxaejsxknf
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import unquote

          raw = os.environ.get("DATABASE_URL", "")
          project_ref = os.environ["PROJECT_REF"]

          def fail(message):
              print(f"::error::{message} No credential or raw URI was printed.")
              sys.exit(1)

          if not raw:
              fail("NAXA_DATABASE_URL is empty.")
          if raw != raw.strip():
              fail("NAXA_DATABASE_URL contains leading or trailing whitespace. Store only the connection URI, without spaces or line breaks.")

          # Diagnose literal '#' by its position, without assuming it belongs to the password.
          hash_index = raw.find("#")
          at_index = raw.find("@")
          if hash_index >= 0:
              if at_index < 0 or hash_index < at_index:
                  fail("NAXA_DATABASE_URL contains a literal # before the host separator (@). The URI credentials section or separators are malformed; this does not establish that the database password itself is incorrect.")
              fail("NAXA_DATABASE_URL contains a literal # after the host separator (@), so the server/path portion includes a URI fragment. Check for an extra suffix or comment in the stored connection string.")

          # Parse the expected Supabase PostgreSQL URI shape explicitly. Reserved
          # delimiters inside credentials must be percent-encoded in a URI.
          match = re.fullmatch(
              r"(?P<scheme>postgres(?:ql)?)://(?P<userinfo>[^/@?#]+)@(?P<host>[^/:?#]+):(?P<port>[0-9]+)(?P<path>/[^?#]*)?(?:\?(?P<query>[^#]*))?",
              raw,
          )
          if not match:
              fail("NAXA_DATABASE_URL does not match the expected PostgreSQL URI structure. Verify the user:password@host:port separators; do not change a valid password merely because this check fails.")

          userinfo = match.group("userinfo")
          if userinfo.count(":") != 1:
              fail("NAXA_DATABASE_URL must contain one user/password separator before the @host section.")
          encoded_username, encoded_password = userinfo.split(":", 1)
          username = unquote(encoded_username)
          password = unquote(encoded_password)
          scheme = match.group("scheme")
          host = match.group("host").lower()
          port = int(match.group("port"))

          if scheme not in ("postgres", "postgresql"):
              fail("NAXA_DATABASE_URL must use postgres:// or postgresql://.")
          is_pooler = bool(re.fullmatch(r"aws-[0-9]+-[a-z0-9-]+\.pooler\.supabase\.com", host))
          is_direct = host == f"db.{project_ref}.supabase.co"
          if not (is_pooler or is_direct):
              fail("NAXA_DATABASE_URL host is not a recognized Supabase database endpoint for this project.")
          if is_pooler and not username.endswith("." + project_ref):
              fail("Shared-pooler username must end with the project reference shown in Supabase Connect.")
          if is_direct and username != "postgres":
              fail("Direct-connection username must be postgres.")
          if not password or password == "[YOUR-PASSWORD]":
              fail("NAXA_DATABASE_URL has no actual database password.")
          if port != 5432:
              fail("Use a Supabase direct connection or shared Session pooler on port 5432 for pg_dump; do not use the Transaction pooler on port 6543.")
          print(f"PostgreSQL URI preflight passed: host={host}, port={port}, mode={'Session pooler' if is_pooler else 'Direct'}")
          PY

      - name: Dump PostgreSQL 17 database
        shell: bash
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.NAXA_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          docker run --rm \
            --env SUPABASE_DATABASE_URL \
            --volume "$PWD/backup:/backup" \
            postgres:17-alpine sh -euc '
              pg_dump --dbname="$SUPABASE_DATABASE_URL" --format=custom --no-owner --no-privileges --file=/backup/naxa.dump
              pg_restore --list /backup/naxa.dump >/backup/restore-catalog.txt
              test -s /backup/naxa.dump
              test -s /backup/restore-catalog.txt
            '
          sha256sum backup/naxa.dump > backup/naxa.dump.sha256

      - name: Encrypt backup before storage
        shell: bash
        env:
          NAXA_BACKUP_ENCRYPTION_KEY: ${{ secrets.NAXA_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:NAXA_BACKUP_ENCRYPTION_KEY \
            -in backup/naxa.dump -out backup/naxa.dump.enc
          test -s backup/naxa.dump.enc
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:NAXA_BACKUP_ENCRYPTION_KEY \
            -in backup/naxa.dump.enc -out backup/verify.dump
          cmp backup/naxa.dump backup/verify.dump
          sha256sum backup/naxa.dump.enc > backup/naxa.dump.enc.sha256
          rm -f backup/naxa.dump backup/verify.dump

      - name: Write backup manifest
        shell: bash
        env:
          PROJECT_REF: eouwtuusnsuxaejsxknf
        run: |
          set -euo pipefail
          printf '{"project_ref":"%s","created_at_utc":"%s","commit":"%s","encrypted":true,"format":"pg_dump custom","restore_catalog_validated":true}\n' \
            "$PROJECT_REF" "$(date -u +%FT%TZ)" "$GITHUB_SHA" > backup/manifest.json

      - name: Store encrypted backup in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: naxa-db-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backup/naxa.dump.enc
            backup/naxa.dump.enc.sha256
            backup/manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Configure external S3-compatible backup destination
        if: ${{ env.NAXA_BACKUP_S3_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.NAXA_BACKUP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.NAXA_BACKUP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.NAXA_BACKUP_AWS_REGION || 'eu-west-1' }}

      - name: Copy encrypted backup to independent S3 storage
        if: ${{ env.NAXA_BACKUP_S3_BUCKET != '' }}
        shell: bash
        env:
          BUCKET: ${{ secrets.NAXA_BACKUP_S3_BUCKET }}
          PREFIX: ${{ vars.NAXA_BACKUP_S3_PREFIX || 'naxa/postgres' }}
          ENDPOINT_URL: ${{ secrets.NAXA_BACKUP_S3_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          if [ -n "$ENDPOINT_URL" ]; then
            aws --endpoint-url "$ENDPOINT_URL" s3 cp backup/naxa.dump.enc "s3://$BUCKET/$PREFIX/$(date -u +%Y/%m/%d)/naxa-${GITHUB_RUN_ID}.dump.enc"
            aws --endpoint-url "$ENDPOINT_URL" s3 cp backup/naxa.dump.enc.sha256 "s3://$BUCKET/$PREFIX/$(date -u +%Y/%m/%d)/naxa-${GITHUB_RUN_ID}.dump.enc.sha256"
            aws --endpoint-url "$ENDPOINT_URL" s3 cp backup/manifest.json "s3://$BUCKET/$PREFIX/$(date -u +%Y/%m/%d)/naxa-${GITHUB_RUN_ID}.manifest.json"
          else
            aws s3 cp backup/naxa.dump.enc "s3://$BUCKET/$PREFIX/$(date -u +%Y/%m/%d)/naxa-${GITHUB_RUN_ID}.dump.enc"
            aws s3 cp backup/naxa.dump.enc.sha256 "s3://$BUCKET/$PREFIX/$(date -u +%Y/%m/%d)/naxa-${GITHUB_RUN_ID}.dump.enc.sha256"
            aws s3 cp backup/manifest.json "s3://$BUCKET/$PREFIX/$(date -u +%Y/%m/%d)/naxa-${GITHUB_RUN_ID}.manifest.json"
          fi
