title = "NAXA Gitleaks configuration"

[extend]
useDefault = true

# Firebase Android client API keys are shipped in google-services.json by design.
# This exception is restricted to the Firebase current_key field in this one client
# configuration file. It does not allow service-account private keys or other secrets.
[[allowlists]]
description = "Public Firebase Android client API key in the checked-in Google Services config"
condition = "AND"
targetRules = ["gcp-api-key", "generic-api-key"]
regexTarget = "line"
paths = ['(^|/)android/app/google-services\.json$']
regexes = ['"current_key"\s*:\s*"AIza[0-9A-Za-z_-]{35}"']
