name: NAXA independent database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
  # Validate the backup workflow automatically whenever its definition changes.
  push:
    paths:
      - ".github/workflows/naxa-independent-backup.yml"

permissions:
  contents: read

concurrency:
  group: naxa-independent-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NAXA_BACKUP_S3_BUCKET: ${{ secrets.NAXA_BACKUP_S3_BUCKET }}
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NAXA_DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.NAXA_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "::error::Missing NAXA_DATABASE_URL. Store the complete Session Pooler URI from Supabase Connect."; exit 1; }
          test -n "$ENCRYPTION_KEY" || { echo "::error::Missing NAXA_BACKUP_ENCRYPTION_KEY repository secret"; exit 1; }
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::NAXA_DATABASE_URL must be the complete PostgreSQL connection URI"; exit 1 ;;
          esac

      - name: Require Supabase shared Session Pooler URI
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.NAXA_DATABASE_URL }}
          PROJECT_REF: eouwtuusnsuxaejsxknf
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import parse_qsl, unquote, urlencode, urlsplit, urlunsplit

          raw = os.environ.get("DATABASE_URL", "")
          project_ref = os.environ["PROJECT_REF"]

          def fail(message):
              print(f"::error::{message} Credentials and connection URI were not printed.")
              sys.exit(1)

          if not raw or raw != raw.strip() or any(ch in raw for ch in "\r\n\t"):
              fail("NAXA_DATABASE_URL is empty or contains whitespace/newlines.")

          try:
              parsed = urlsplit(raw)
              username = unquote(parsed.username or "")
              password = unquote(parsed.password or "")
              host = (parsed.hostname or "").lower()
              port = parsed.port or 5432
          except ValueError:
              fail("NAXA_DATABASE_URL is not a valid PostgreSQL connection URI.")

          if parsed.scheme not in ("postgres", "postgresql"):
              fail("NAXA_DATABASE_URL must be a PostgreSQL URI.")
          if host == f"db.{project_ref}.supabase.co":
              fail("The direct Supabase host is not reachable from this GitHub runner over IPv6. Replace NAXA_DATABASE_URL with the project's Shared Session Pooler URI (port 5432).")
          if not host.endswith(".pooler.supabase.com"):
              fail("Use the Supabase Shared Session Pooler host copied from Dashboard > Connect.")
          if port != 5432:
              fail("Use Shared Session Pooler port 5432. Transaction Pooler port 6543 is not supported for this backup dump.")
          if username != f"postgres.{project_ref}":
              fail("The pooler username must be postgres.<project-ref> for this project.")
          if parsed.path.rstrip("/") not in ("", "/postgres"):
              fail("The connection URI must target the postgres database.")
          if not password or password == "[YOUR-PASSWORD]":
              fail("The connection URI does not contain the real PostgreSQL Database Password.")
          if parsed.fragment:
              fail("The connection URI must not contain a fragment.")

          query = parse_qsl(parsed.query, keep_blank_values=True)
          if not any(key.lower() == "sslmode" for key, _ in query):
              query.append(("sslmode", "require"))
          target_url = urlunsplit((parsed.scheme, parsed.netloc, parsed.path or "/postgres", urlencode(query), ""))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"SUPABASE_DATABASE_URL={target_url}\n")

          print(f"Supabase shared Session Pooler URI syntax validated for project {project_ref} on port 5432. Credentials were not printed.")
          PY

      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Dump PostgreSQL with the Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup

          # Supabase's supported dump path filters managed internal schemas
          # and creates separate role, schema and data restore scripts.
          supabase db dump --remote="$SUPABASE_DATABASE_URL" -f backup/roles.sql --role-only
          supabase db dump --remote="$SUPABASE_DATABASE_URL" -f backup/schema.sql
          supabase db dump --remote="$SUPABASE_DATABASE_URL" -f backup/data.sql --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"

          test -s backup/roles.sql
          test -s backup/schema.sql
          test -s backup/data.sql
          tar -czf backup/naxa-supabase-backup.tar.gz -C backup roles.sql schema.sql data.sql
          test -s backup/naxa-supabase-backup.tar.gz
          sha256sum backup/naxa-supabase-backup.tar.gz > backup/naxa-supabase-backup.tar.gz.sha256

      - name: Encrypt backup before storage
        shell: bash
        env:
          NAXA_BACKUP_ENCRYPTION_KEY: ${{ secrets.NAXA_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:NAXA_BACKUP_ENCRYPTION_KEY \
            -in backup/naxa-supabase-backup.tar.gz -out backup/naxa-supabase-backup.tar.gz.enc
          test -s backup/naxa-supabase-backup.tar.gz.enc
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:NAXA_BACKUP_ENCRYPTION_KEY \
            -in backup/naxa-supabase-backup.tar.gz.enc -out backup/verify.tar.gz
          cmp backup/naxa-supabase-backup.tar.gz backup/verify.tar.gz
          sha256sum backup/naxa-supabase-backup.tar.gz.enc > backup/naxa-supabase-backup.tar.gz.enc.sha256
          rm -f backup/naxa-supabase-backup.tar.gz backup/verify.tar.gz backup/roles.sql backup/schema.sql backup/data.sql

      - name: Write backup manifest
        shell: bash
        env:
          PROJECT_REF: eouwtuusnsuxaejsxknf
        run: |
          set -euo pipefail
          printf '{"project_ref":"%s","created_at_utc":"%s","commit":"%s","encrypted":true,"format":"Supabase CLI roles/schema/data SQL archive","archive_integrity_verified":true,"restore_tested":false}\n' \
            "$PROJECT_REF" "$(date -u +%FT%TZ)" "$GITHUB_SHA" > backup/manifest.json

      - name: Store encrypted backup in GitHub Actions
        uses: actions/upload-artifact@v7
        with:
          name: naxa-db-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backup/naxa-supabase-backup.tar.gz.enc
            backup/naxa-supabase-backup.tar.gz.enc.sha256
            backup/manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Configure external S3-compatible backup destination
        if: ${{ env.NAXA_BACKUP_S3_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.NAXA_BACKUP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.NAXA_BACKUP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.NAXA_BACKUP_AWS_REGION || 'eu-west-1' }}

      - name: Copy encrypted backup to independent S3 storage
        if: ${{ env.NAXA_BACKUP_S3_BUCKET != '' }}
        shell: bash
        env:
          BUCKET: ${{ secrets.NAXA_BACKUP_S3_BUCKET }}
          PREFIX: ${{ vars.NAXA_BACKUP_S3_PREFIX || 'naxa/postgres' }}
          ENDPOINT_URL: ${{ secrets.NAXA_BACKUP_S3_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          if [ -n "$ENDPOINT_URL" ]; then
            aws --endpoint-url "$ENDPOINT_URL" s3 cp backup/naxa-supabase-backup.tar.gz.enc "s3://$BUCKET/$PREFIX/$(date -u +%Y/%m/%d)/naxa-${GITHUB_RUN_ID}.tar.gz.enc"
            aws --endpoint-url "$ENDPOINT_URL" s3 cp backup/naxa-supabase-backup.tar.gz.enc.sha256 "s3://$BUCKET/$PREFIX/$(date -u +%Y/%m/%d)/naxa-${GITHUB_RUN_ID}.tar.gz.enc.sha256"
            aws --endpoint-url "$ENDPOINT_URL" s3 cp backup/manifest.json "s3://$BUCKET/$PREFIX/$(date -u +%Y/%m/%d)/naxa-${GITHUB_RUN_ID}.manifest.json"
          else
            aws s3 cp backup/naxa-supabase-backup.tar.gz.enc "s3://$BUCKET/$PREFIX/$(date -u +%Y/%m/%d)/naxa-${GITHUB_RUN_ID}.tar.gz.enc"
            aws s3 cp backup/naxa-supabase-backup.tar.gz.enc.sha256 "s3://$BUCKET/$PREFIX/$(date -u +%Y/%m/%d)/naxa-${GITHUB_RUN_ID}.tar.gz.enc.sha256"
            aws s3 cp backup/manifest.json "s3://$BUCKET/$PREFIX/$(date -u +%Y/%m/%d)/naxa-${GITHUB_RUN_ID}.manifest.json"
          fi
