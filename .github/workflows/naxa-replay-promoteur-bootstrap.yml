name: NAXA Replay Promoteur E2E bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/naxa-replay-promoteur-bootstrap.yml"
      - "scripts/e2e/provision-replay-promoteur.cjs"
      - "scripts/test-replay-promoteur-provisioner.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxa-replay-promoteur-bootstrap
  cancel-in-progress: false

jobs:
  provision-and-verify:
    name: Provisionnement Promoteur et vérification Storage sur Replay
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.NAXA_STORAGE_E2E_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NAXA_STORAGE_E2E_ADMIN_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      NAXA_STORAGE_E2E_URL: ${{ secrets.NAXA_STORAGE_E2E_URL || secrets.SUPABASE_URL }}
      NAXA_STORAGE_E2E_ANON_KEY: ${{ secrets.NAXA_STORAGE_E2E_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      NAXA_STORAGE_E2E_ADMIN_KEY: ${{ secrets.NAXA_STORAGE_E2E_ADMIN_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      NAXA_STORAGE_E2E_PROMOTEUR_EMAIL: naxa.e2e.promoteur@example.invalid
      NAXA_STORAGE_E2E_REQUIRE_ROLE_MATRIX: "0"
    steps:
      - name: Checkout source main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Vérifier les contrats du provisionneur
        run: node --test scripts/test-replay-promoteur-provisioner.cjs
      - name: Vérifier le périmètre Replay et les secrets nécessaires
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          valid=true
          test -n "$SUPABASE_URL" || valid=false
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || valid=false
          test -n "$NAXA_STORAGE_E2E_ANON_KEY" || valid=false
          if [ "$valid" = "true" ]; then
            case "$SUPABASE_URL" in
              https://pwfftcsjyeibxxqhwysw.supabase.co) ;;
              *) echo "::error::Ce workflow est strictement limité à NAXA Replay ; Production est refusée."; exit 1 ;;
            esac
          fi
          if [ "$valid" != "true" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Secrets Replay absents : URL, clé service_role et clé anon sont requis."
              exit 1
            fi
            echo "::warning::Provisionnement ignoré : les secrets Replay requis ne sont pas tous configurés."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Créer ou reprendre le Promoteur de recette sur Replay
        if: steps.preflight.outputs.configured == 'true'
        run: node scripts/e2e/provision-replay-promoteur.cjs
      - name: Exécuter Storage E2E et la matrice Promoteur
        if: steps.preflight.outputs.configured == 'true'
        run: node scripts/storage-e2e.cjs
