name: NAXA Replay Promoteur E2E (secret-safe, pharmacy isolation)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/naxa-replay-promoteur-secret-safe-v2.yml"
      - "scripts/e2e/provision-replay-promoteur-safe-v2.cjs"
      - "scripts/test-replay-promoteur-safe-v2.cjs"
      - "scripts/e2e/provision-replay-admin-safe.cjs"
      - "scripts/test-replay-admin-safe.cjs"
      - "scripts/e2e/provision-replay-livreur-safe.cjs"
      - "scripts/test-replay-livreur-safe.cjs"
      - "scripts/e2e/provision-replay-pharmacy-staff-safe.cjs"
      - "scripts/test-replay-pharmacy-staff-safe.cjs"
      - "scripts/test-caisse-provisioning-action.cjs"
      - "src/app/pharmacie/actions.ts"
      - "supabase/migrations/20261115180000_provision_pharmacy_cash_register_with_assignment.sql"
      - "supabase/tests/20261115180000_provision_pharmacy_cash_register_with_assignment.sql"
      - "scripts/storage-e2e.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxa-replay-promoteur-secret-safe-v2
  cancel-in-progress: false

jobs:
  provision-and-verify:
    name: Promoteur, logo pharmacy upsert et isolation inter-pharmacies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.NAXA_STORAGE_E2E_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NAXA_STORAGE_E2E_ADMIN_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      NAXA_STORAGE_E2E_URL: ${{ secrets.NAXA_STORAGE_E2E_URL || secrets.SUPABASE_URL }}
      NAXA_STORAGE_E2E_ANON_KEY: ${{ secrets.NAXA_STORAGE_E2E_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
      NAXA_STORAGE_E2E_ADMIN_KEY: ${{ secrets.NAXA_STORAGE_E2E_ADMIN_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      NAXA_STORAGE_E2E_ADMIN_EMAIL: naxa.e2e.20261104.admin@example.invalid
      NAXA_STORAGE_E2E_PROMOTEUR_EMAIL: naxa.e2e.promoteur@example.invalid
      NAXA_STORAGE_E2E_REQUIRE_ROLE_MATRIX: "1"
    steps:
      - name: Checkout source main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Tester les contrats de sélection inter-pharmacies et la sécurité de la fixture Admin
        run: node --test scripts/test-replay-promoteur-safe-v2.cjs scripts/test-replay-admin-safe.cjs scripts/test-replay-livreur-safe.cjs scripts/test-replay-pharmacy-staff-safe.cjs scripts/test-caisse-provisioning-action.cjs
      - name: Vérifier les secrets et épingler Replay
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$NAXA_STORAGE_E2E_ANON_KEY"
          case "$SUPABASE_URL" in
            https://pwfftcsjyeibxxqhwysw.supabase.co) ;;
            *) echo "::error::Ce workflow est strictement limité à NAXA Replay ; Production est refusée."; exit 1 ;;
          esac
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Créer ou reprendre le Promoteur E2E sur Replay
        if: steps.preflight.outputs.configured == 'true'
        run: node scripts/e2e/provision-replay-promoteur-safe-v2.cjs
      - name: Préparer la fixture Admin E2E existante sans exposer son secret
        if: steps.preflight.outputs.configured == 'true'
        run: node scripts/e2e/provision-replay-admin-safe.cjs
      - name: Préparer la fixture Client/Livreur via le parcours invitation sur Replay
        if: steps.preflight.outputs.configured == 'true'
        run: node scripts/e2e/provision-replay-livreur-safe.cjs
      - name: Préparer le Client acheteur, le Gestionnaire Stock et la Caisse sur Replay
        if: steps.preflight.outputs.configured == 'true'
        run: node scripts/e2e/provision-replay-pharmacy-staff-safe.cjs
      - name: Exécuter Storage E2E avec matrices Admin et Promoteur obligatoires
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          admin_password_file="$NAXA_STORAGE_E2E_ADMIN_PASSWORD_FILE"
          promoter_password_file="$NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD_FILE"
          test -s "$admin_password_file"
          test -s "$promoter_password_file"
          trap 'rm -f "$admin_password_file" "$promoter_password_file"' EXIT
          NAXA_STORAGE_E2E_ADMIN_PASSWORD="$(cat "$admin_password_file")"
          NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD="$(cat "$promoter_password_file")"
          export NAXA_STORAGE_E2E_ADMIN_PASSWORD NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD
          echo "::add-mask::$NAXA_STORAGE_E2E_ADMIN_PASSWORD"
          echo "::add-mask::$NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD"
          unset NAXA_STORAGE_E2E_ADMIN_PASSWORD_FILE NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD_FILE
          node scripts/storage-e2e.cjs
      - name: Nettoyer les fichiers de mots de passe éphémères (toujours)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -z "${NAXA_STORAGE_E2E_ADMIN_PASSWORD_FILE:-}" ] || rm -f "$NAXA_STORAGE_E2E_ADMIN_PASSWORD_FILE"
          [ -z "${NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD_FILE:-}" ] || rm -f "$NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD_FILE"
          [ -z "${NAXA_STORAGE_E2E_LIVREUR_PASSWORD_FILE:-}" ] || rm -f "$NAXA_STORAGE_E2E_LIVREUR_PASSWORD_FILE"
