version: 2.1

jobs:
  lint_actionprotegee:
    docker:
      - image: cimg/node:20.14
    steps:
      - checkout
      - run:
          name: Installer
          command: npm install --no-audit --no-fund
      - run:
          name: Lint ActionProtegee
          command: npx eslint src/components/ActionProtegee.tsx

