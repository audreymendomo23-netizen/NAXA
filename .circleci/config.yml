version: 2.1

jobs:
  lint_app:
    docker:
      - image: cimg/node:20.14
    steps:
      - checkout
      - run:
          name: Installer
          command: npm install --no-audit --no-fund
      - run:
          name: Lint app
          command: npx eslint src/app

  lint_components:
    docker:
      - image: cimg/node:20.14
    steps:
      - checkout
      - run:
          name: Installer
          command: npm install --no-audit --no-fund
      - run:
          name: Lint components
          command: npx eslint src/components

  lint_lib:
    docker:
      - image: cimg/node:20.14
    steps:
      - checkout
      - run:
          name: Installer
          command: npm install --no-audit --no-fund
      - run:
          name: Lint lib
          command: npx eslint src/lib

workflows:
  lint_app:
    jobs:
      - lint_app
  lint_components:
    jobs:
      - lint_components
  lint_lib:
    jobs:
      - lint_lib
