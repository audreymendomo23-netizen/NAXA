plugins {
    id "com.android.application"
}

android {
    namespace "cm.naxa.paymentcompanion"
    compileSdk 36

    defaultConfig {
        applicationId "cm.naxa.paymentcompanion"
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName "1.4.0"
    }

    flavorDimensions += "distribution"
    productFlavors {
        standard {
            dimension "distribution"
            applicationId "cm.naxa.paymentcompanion"
            buildConfigField "boolean", "ADMIN_CAPTURE_ENABLED", "false"
            buildConfigField "boolean", "PROFESSIONAL_CAPTURE_ENABLED", "false"
        }
        professional {
            dimension "distribution"
            applicationId "cm.naxa.paymentcompanion.professional"
            versionNameSuffix "-professional"
            buildConfigField "boolean", "ADMIN_CAPTURE_ENABLED", "false"
            buildConfigField "boolean", "PROFESSIONAL_CAPTURE_ENABLED", "true"
        }
        admin {
            dimension "distribution"
            applicationId "cm.naxa.paymentcompanion.admin"
            versionNameSuffix "-admin"
            buildConfigField "boolean", "ADMIN_CAPTURE_ENABLED", "true"
            buildConfigField "boolean", "PROFESSIONAL_CAPTURE_ENABLED", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
