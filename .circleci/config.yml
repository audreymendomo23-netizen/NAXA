version: 2.1

jobs:
  quality:
    docker:
      - image: cimg/node:20.14
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://build-test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-test-service-role-key
    steps:
      - checkout
      - run:
          name: Installer les dépendances
          command: npm install --no-audit --no-fund
      - run:
          name: TypeScript
          command: npx tsc --noEmit
      - run:
          name: Build Next.js
          command: npm run build

  sql_tests:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Préflight intégrité SQL N4
          command: |
            set -uo pipefail
            echo "HEAD=$(git rev-parse HEAD)"
            echo "BRANCH=${CIRCLE_BRANCH:-unknown}"
            FAILS=()
            check() {
              local label="$1"
              shift
              echo "CHECK: $label"
              if "$@"; then
                echo "PASS: $label"
              else
                echo "FAIL: $label"
                FAILS+=("$label")
              fi
              return 0
            }
            check_count() {
              local label="$1" expected="$2" needle="$3" file="$4" count
              echo "CHECK: $label"
              count="$(grep -Fc "$needle" "$file" || true)"
              echo "TROUVÉ: $count occurrence(s) ; attendu: $expected"
              echo "LIGNES:"
              grep -nF "$needle" "$file" || true
              if [[ "$count" -eq "$expected" ]]; then
                echo "PASS: $label"
              else
                echo "FAIL: $label (trouvé $count, attendu $expected)"
                FAILS+=("$label (trouvé $count, attendu $expected)")
              fi
              return 0
            }
            check "schema.sql présent et non vide" test -s supabase/schema.sql
            check_count "my_pharmacie() : une définition attendue" 1 "create or replace function my_pharmacie()" supabase/schema.sql
            check_count "restore_stock( : une définition attendue" 1 "create or replace function restore_stock(" supabase/schema.sql
            check_count "expire_reservations() : une définition attendue" 1 "create or replace function expire_reservations()" supabase/schema.sql
            check_count "on_auth_user_created : un trigger attendu" 1 "create trigger on_auth_user_created" supabase/schema.sql
            check_count "as $select : zéro occurrence attendue" 0 'as $select' supabase/schema.sql
            check_count "as $; : zéro occurrence attendue" 0 'as $;' supabase/schema.sql
            check "Aucun délimiteur dollar malformé ($;) dans le schéma ou les migrations" bash -c 'if grep -R -nE "^[[:space:]]*\\$;[[:space:]]*$" supabase/schema.sql supabase/migration_*.sql; then exit 1; else rc=$?; [[ "$rc" -eq 1 ]]; fi'
            check "restore_stock : révocation après définition" bash -c 'def="$(grep -nF "create or replace function restore_stock(" supabase/schema.sql | head -1 | cut -d: -f1)"; rev="$(grep -nF "revoke execute on function restore_stock(uuid)" supabase/schema.sql | head -1 | cut -d: -f1)"; [[ -n "$def" && -n "$rev" && "$rev" -gt "$def" ]]'
            check "expire_reservations : révocation après définition" bash -c 'def="$(grep -nF "create or replace function expire_reservations()" supabase/schema.sql | head -1 | cut -d: -f1)"; rev="$(grep -nF "revoke execute on function expire_reservations()" supabase/schema.sql | head -1 | cut -d: -f1)"; [[ -n "$def" && -n "$rev" && "$rev" -gt "$def" ]]'
            check "can_access_pharmacy : définition avant première utilisation dans migration 013" bash -c 'f=supabase/migration_013_stocks_couts.sql; def="$(grep -nF "create or replace function public.can_access_pharmacy" "$f" | head -1 | cut -d: -f1)"; use="$(grep -nF "or public.can_access_pharmacy(" "$f" | head -1 | cut -d: -f1)"; [[ -n "$def" && -n "$use" && "$use" -gt "$def" ]]'
            check "Aucune référence legacy public.profile_privileges" bash -c 'if grep -R -nF "public.profile_privileges" supabase/migration_*.sql; then exit 1; else rc=$?; [[ "$rc" -eq 1 ]]; fi'
            run_function_privilege_preflight() {
              python3 - <<'PY'
            import re
            from pathlib import Path
            files = [Path("supabase/schema.sql")] + sorted(Path("supabase").glob("migration_*.sql"))
            defined = set()
            definition = re.compile(r"create\s+(?:or\s+replace\s+)?function\s+(?:public\.)?([a-zA-Z_]\w*)\s*\(", re.I)
            privilege = re.compile(r"(?:grant|revoke)\b[^;]*?on\s+function\s+(?:public\.)?([a-zA-Z_]\w*)\s*\(", re.I)
            errors = []
            for path in files:
                for line_no, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                    for m in privilege.finditer(line):
                        fn = m.group(1)
                        if fn not in defined:
                            errors.append(f"{path}:{line_no}: privilege before definition or unknown function: {fn}")
                    for m in definition.finditer(line):
                        defined.add(m.group(1))
            if errors:
                print("\n".join(errors))
                raise SystemExit(1)
            print(f"SQL function privilege-order preflight: OK ({len(defined)} function names known)")
            PY
            }
            check "Ordre des privilèges GRANT/REVOKE sur les fonctions SQL" run_function_privilege_preflight
            if (( ${#FAILS[@]} > 0 )); then
              echo "RÉCAPITULATIF : ${#FAILS[@]} contrôle(s) en échec"
              printf ' - %s\n' "${FAILS[@]}"
              exit 1
            fi
            echo "SQL preflight: OK — tous les contrôles sont verts"
      - run:
          name: Installer les dépendances frontend
          command: npm install --no-audit --no-fund
      - run:
          name: Préparer Supabase local
          command: |
            npx supabase@latest init --force
            cat > supabase/config.toml \<<'EOF'
            project_id = "naxa-tests-ci"
            [api]
            enabled = true
            [db]
            major_version = 17
            [studio]
            enabled = false
            EOF
            rm -rf supabase/migrations
            mkdir -p supabase/migrations
            cp supabase/schema.sql supabase/migrations/20261006000000_base.sql
            n=1
            for f in supabase/migration_*.sql; do
              ts=$(printf '202610060000%02d' "$n")
              cp "$f" "supabase/migrations/${ts}_$(basename "$f")"
              n=$((n+1))
            done
      - run:
          name: Démarrer Supabase local
          command: npx supabase@latest start -x studio -x mailpit -x storage-api -x realtime
      - run:
          name: Replay complet des migrations
          command: npx supabase@latest db reset
      - run:
          name: Exécuter tous les tests SQL
          command: |
            set -euo pipefail
            for f in supabase/tests/*.sql; do
              echo "=== TEST $f ==="
              out="$(mktemp)"
              npx supabase@latest db query --file "$f" 2>&1 | tee "$out"
              if grep -Eq '(^|[[:space:]])f([[:space:]]|$)' "$out"; then
                echo "ÉCHEC: au moins une assertion booléenne est fausse dans $f"
                rm -f "$out"
                exit 1
              fi
              rm -f "$out"
            done
      - run:
          name: Arrêter Supabase local
          command: npx supabase@latest stop --no-backup
          when: always

workflows:
  quality_and_tests:
    jobs:
      - quality
      - sql_tests:
          requires:
            - quality