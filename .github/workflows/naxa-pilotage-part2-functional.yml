name: NAXA Pilotage 360 Part 2 Functional
on:
  push:
    branches:
      - rewrite/naxa-from-main-20261007
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner diagnostic
        run: |
          echo "PART2_RUNNER_DIAGNOSTIC=PASS"
          uname -a
          node --version
          npm --version

  part2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        shell: bash
        run: npm install --global supabase && supabase --version
      - name: Prepare isolated replay
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/config.toml <<'EOF'
          project_id = "naxa-part2-functional"
          [api]
          enabled = true
          [db]
          major_version = 17
          [studio]
          enabled = false
          [inbucket]
          enabled = false
          [storage]
          enabled = true
          [realtime]
          enabled = false
          [analytics]
          enabled = false
          [edge_runtime]
          enabled = false
          EOF
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          cp supabase/schema.sql supabase/migrations/20261006000000_base.sql
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("supabase/migrations/20261006000000_base.sql")
          s=p.read_text()
          a=s.index("create or replace function handle_new_user")
          b=s.index("create trigger on_auth_user_created",a)
          handle=r"""create or replace function handle_new_user()
          returns trigger language plpgsql security definer set search_path=public
          as $fn$
          declare
            v_username text:=lower(trim(new.raw_user_meta_data->>'username'));
            v_first_name text:=trim(new.raw_user_meta_data->>'first_name');
            v_last_name text:=trim(new.raw_user_meta_data->>'last_name');
            v_phone text:=trim(new.raw_user_meta_data->>'phone');
            v_country text:=upper(trim(new.raw_user_meta_data->>'phone_country'));
            v_dob date:=(new.raw_user_meta_data->>'date_of_birth')::date;
            v_consent boolean:=coalesce((new.raw_user_meta_data->>'consent_accepted')::boolean,false);
          begin
            if v_username is null or v_username !~ '^[a-z0-9][a-z0-9._-]{2,29}$' then raise exception 'Nom d''utilisateur invalide'; end if;
            if exists(select 1 from public.profiles where lower(username)=v_username) then raise exception 'Nom d''utilisateur déjà pris'; end if;
            if v_first_name is null or v_last_name is null then raise exception 'Identité invalide'; end if;
            if v_dob is null or extract(year from age(current_date,v_dob))<18 then raise exception '18+ requis'; end if;
            if not v_consent then raise exception 'Consentement requis'; end if;
            insert into public.profiles(id,role,username,first_name,last_name,phone,phone_country,date_of_birth,age_verified,consent_accepted_at)
            values(new.id,'client',v_username,v_first_name,v_last_name,v_phone,v_country,v_dob,true,now());
            return new;
          end;
          $fn$;
          """
          s=s[:a]+handle+s[b:]
          a=s.index("create or replace function my_pharmacie")
          b=s.index("alter table profiles",a)
          s=s[:a]+"""create or replace function my_pharmacie() returns uuid
          language sql stable security definer set search_path=public
          as $fn$ select pharmacie_id from profiles where id=auth.uid() and actif=true and role in ('pharmacie','promoteur','caisse'); $fn$;
          """+s[b:]
          s=re.sub(r"insert into storage\.buckets\s*\([^;]*?\)\s*values\s*\([^;]*?\);\s*","",s,flags=re.I|re.S)
          p.write_text(s)
          PY
          n=1
          for f in supabase/migration_*.sql; do
            printf -v ts '20261006%06d' "$n"
            cp "$f" "supabase/migrations/${ts}_$(basename "$f")"
            n=$((n+1))
          done
      - name: Replay database
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset
      - name: Execute Part 2 contradictory test
        shell: bash
        run: |
          set -euo pipefail
          supabase db query --file supabase/tests/049_pilotage_performance_socle.sql
      - name: Structural assertions
        run: |
          grep -Fq "v_reservations_ca" supabase/migration_049_pilotage_performance_socle.sql
          grep -Fq "stats_pilotage_scope" supabase/migration_049_pilotage_performance_socle.sql
          grep -Fq "PART2_FAIL_SCOPE_LEAK" supabase/tests/049_pilotage_performance_socle.sql
          echo PART2_FUNCTIONAL_GREEN
      - name: Stop Supabase
        if: always()
        run: supabase stop
