name: NAXA — Pilotage Performance — Étape 1 — preuve
on:
  push:
    branches:
      - feat/promoteur-partie3-responsable-accreditation-20261006
  pull_request:
    branches:
      - consolidation

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-test-service-role-key

  pilotage-step1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Configurer Supabase local
        run: |
          cat > supabase/config.toml <<'EOF'
          project_id = "naxa-pilotage-step1-ci"
          [api]
          enabled = true
          [db]
          major_version = 17
          [studio]
          enabled = false
          [inbucket]
          enabled = false
          [storage]
          enabled = true
          [realtime]
          enabled = false
          [analytics]
          enabled = false
          [edge_runtime]
          enabled = false
          EOF

      - name: Préparer le replay historique
        run: |
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          cp supabase/schema.sql supabase/migrations/20261006000000_base.sql
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("supabase/migrations/20261006000000_base.sql")
          s = p.read_text()

          a = s.index("create or replace function handle_new_user")
          b = s.index("then raise exception 'Nom d''utilisateur invalide'", a)
          handle = r"""create or replace function handle_new_user()
          returns trigger language plpgsql security definer set search_path=public
          as $fn$
          declare
            v_username text := lower(trim(new.raw_user_meta_data->>'username'));
            v_first_name text := trim(new.raw_user_meta_data->>'first_name');
            v_last_name text := trim(new.raw_user_meta_data->>'last_name');
            v_phone text := trim(new.raw_user_meta_data->>'phone');
            v_country text := upper(trim(new.raw_user_meta_data->>'phone_country'));
            v_dob date := (new.raw_user_meta_data->>'date_of_birth')::date;
            v_consent boolean := coalesce((new.raw_user_meta_data->>'consent_accepted')::boolean,false);
          begin
            if v_username is null or v_username !~ '^[a-z0-9][a-z0-9._-]{2,29}$' then raise exception 'Nom d''utilisateur invalide'; end if;
            if exists(select 1 from public.profiles where lower(username)=v_username) then raise exception 'Nom d''utilisateur déjà pris'; end if;
            if v_first_name is null or length(v_first_name)<2 or length(v_first_name)>80 then raise exception 'Prénom invalide'; end if;
            if v_last_name is null or length(v_last_name)<2 or length(v_last_name)>80 then raise exception 'Nom invalide'; end if;
            if v_dob is null or v_dob>current_date or extract(year from age(current_date,v_dob))<18 then raise exception 'NAXA est réservé aux personnes âgées de 18 ans ou plus'; end if;
            if not v_consent then raise exception 'L''acceptation des conditions est obligatoire'; end if;
            if v_country='CM' and v_phone !~ '^\+237[0-9]{9}$' then raise exception 'Numéro de téléphone camerounais invalide';
            elsif v_country='CF' and v_phone !~ '^\+236[0-9]{8}$' then raise exception 'Numéro de téléphone centrafricain invalide';
            elsif v_country='TD' and v_phone !~ '^\+235[0-9]{8}$' then raise exception 'Numéro de téléphone tchadien invalide';
            elsif v_country='CG' and v_phone !~ '^\+242[0-9]{9}$' then raise exception 'Numéro de téléphone congolais invalide';
            elsif v_country='CD' and v_phone !~ '^\+243[0-9]{9}$' then raise exception 'Numéro de téléphone congolais (RDC) invalide';
            elsif v_country='GQ' and v_phone !~ '^\+240[0-9]{9}$' then raise exception 'Numéro de téléphone équato-guinéen invalide';
            elsif v_country='GA' and v_phone !~ '^\+241[0-9]{8}$' then raise exception 'Numéro de téléphone gabonais invalide';
            elsif v_country='ST' and v_phone !~ '^\+239[0-9]{7}$' then raise exception 'Numéro de téléphone santoméen invalide';
            elsif v_country='AO' and v_phone !~ '^\+244[0-9]{9}$' then raise exception 'Numéro de téléphone angolais invalide';
            elsif v_country='BI' and v_phone !~ '^\+257[0-9]{8}$' then raise exception 'Numéro de téléphone burundais invalide';
            elsif v_country='RW' and v_phone !~ '^\+250[0-9]{9}$' then raise exception 'Numéro de téléphone rwandais invalide';
            else raise exception 'Pays ou numéro de téléphone invalide';
            end if;
            insert into public.profiles(id,role,username,first_name,last_name,phone,phone_country,date_of_birth,age_verified,consent_accepted_at)
            values(new.id,'client',v_username,v_first_name,v_last_name,v_phone,v_country,v_dob,true,now());
            return new;
          end;
          $fn$;
          """
          s = s[:a] + handle + s[s.index("create trigger on_auth_user_created", a):]

          a = s.index("create or replace function reserve_stock")
          b = s.index("revoke execute on function restore_stock", a)
          reserve = s[a:b].replace("as $declare", "as $fn$ declare").replace("end$;", "end$fn$;")
          s = s[:a] + reserve + s[b:]

          a = s.index("create or replace function is_admin")
          b = s.index("create or replace function my_pharmacie", a)
          is_admin = """create or replace function is_admin() returns boolean
          language sql stable security definer set search_path=public
          as $fn$ select exists(select 1 from public.profiles where id=auth.uid() and role::text='admin'); $fn$;
          """
          s = s[:a] + is_admin + s[b:]

          a = s.index("create or replace function my_pharmacie")
          b = s.index("alter table profiles", a)
          my_pharmacie = """create or replace function my_pharmacie() returns uuid
          language sql stable security definer set search_path=public
          as $fn$ select pharmacie_id from profiles where id=auth.uid() and actif=true and role in ('pharmacie','promoteur','caisse'); $fn$;
          """
          s = s[:a] + my_pharmacie + s[b:]
          s = re.sub(r"insert into storage\\.buckets\\s*\\([^;]*?\\)\\s*values\\s*\\([^;]*?\\);\\s*", "", s, flags=re.I|re.S)
          s = s.replace("revoke execute on function restore_stock(uuid) from public,anon,authenticated;", "")
          s = s.replace("revoke execute on function expire_reservations() from public,anon,authenticated;", "")
          s = "\\n".join(line for line in s.splitlines() if not line.strip().lower().startswith(("revoke all on function public.naxa_audit_session_", "revoke execute on function public.naxa_audit_session_")))
          s += """
          create table if not exists public.produits(
            id uuid primary key default gen_random_uuid(),
            nom text not null,
            dci text not null default '',
            dosage text not null default '',
            forme text not null default '',
            nom_norm text,
            unique(nom,dosage,forme)
          );
          """
          s += """create extension if not exists pg_trgm; create extension if not exists unaccent; create extension if not exists pgcrypto;
          do $block$ begin create type role_type as enum ('client','pharmacie','promoteur','caisse','admin'); exception when duplicate_object then null; end $block$;
          do $block$ begin create type resa_statut as enum ('en_attente','confirmee','payee','retiree','expiree','annulee'); exception when duplicate_object then null; end $block$;
          create table if not exists public.pharmacies(id uuid primary key default gen_random_uuid(),nom text not null,ville text not null default 'Yaoundé',lat double precision not null,lng double precision not null,actif boolean not null default true,quartier text,adresse text,de_garde boolean not null default false,horaires text,stock_updated_at timestamptz,created_at timestamptz not null default now());
          create table if not exists public.profiles(id uuid primary key references auth.users on delete cascade,role role_type not null default 'client',username text unique,pharmacie_id uuid references public.pharmacies(id),created_at timestamptz not null default now(),first_name text,last_name text,phone text,phone_country text,date_of_birth date,age_verified boolean not null default false,consent_accepted_at timestamptz,parent_profile_id uuid references public.profiles(id) on delete set null,actif boolean not null default true);
          create table if not exists public.stocks(pharmacie_id uuid not null references public.pharmacies(id) on delete cascade,produit_id uuid not null references public.produits(id) on delete cascade,prix integer not null default 0,quantite integer not null default 0,date_peremption date,updated_at timestamptz not null default now(),primary key(pharmacie_id,produit_id));
          """
          s += """create table if not exists public.pharmacie_privee(pharmacie_id uuid primary key references public.pharmacies(id) on delete cascade,whatsapp text not null,code_marchand text);
          create table if not exists public.reservations(id uuid primary key default gen_random_uuid(),client_id uuid not null references auth.users(id),pharmacie_id uuid not null references public.pharmacies(id),statut resa_statut not null default 'en_attente',total integer not null default 0,expires_at timestamptz not null,paiement_ref text,created_at timestamptz not null default now());
          create table if not exists public.reservation_items(reservation_id uuid not null references public.reservations(id) on delete cascade,produit_id uuid not null references public.produits(id),quantite integer not null check(quantite>0),prix_unitaire integer not null,primary key(reservation_id,produit_id));
          """
          s += """
          create or replace function public.is_admin() returns boolean language sql stable security definer set search_path=public
          as $fn$ select exists(select 1 from public.profiles where id=auth.uid() and role::text='admin'); $fn$;
          create or replace function public.my_pharmacie() returns uuid language sql stable security definer set search_path=public
          as $fn$ select pharmacie_id from public.profiles where id=auth.uid() and actif=true and role::text in ('pharmacie','promoteur','caisse'); $fn$;
          """
          s += """
          create or replace function public.reserve_stock(p_pharmacie uuid,p_items jsonb) returns uuid language plpgsql security definer set search_path=public as $fn$ declare v_id uuid; it jsonb; v_total int:=0; v_prix int; v_q int; begin if auth.uid() is null then raise exception 'Connexion requise'; end if; if jsonb_typeof(p_items)<>'array' or jsonb_array_length(p_items)<1 or jsonb_array_length(p_items)>10 then raise exception 'Panier invalide'; end if; if exists(select 1 from (select value->>'produit_id' pid,count(*) n from jsonb_array_elements(p_items) group by value->>'produit_id' having count(*)>1)x) then raise exception 'Produit dupliqué dans le panier'; end if; if not exists(select 1 from public.pharmacies where id=p_pharmacie and actif) then raise exception 'Pharmacie indisponible'; end if; insert into public.reservations(client_id,pharmacie_id,expires_at) values(auth.uid(),p_pharmacie,now()+interval '3 hours') returning id into v_id; for it in select * from jsonb_array_elements(p_items) loop v_q:=coalesce((it->>'quantite')::int,1); if v_q<1 or v_q>10 then raise exception 'Quantité invalide'; end if; update public.stocks set quantite=quantite-v_q where pharmacie_id=p_pharmacie and produit_id=(it->>'produit_id')::uuid and quantite>=v_q returning prix into v_prix; if not found then raise exception 'Stock insuffisant pour un des produits'; end if; insert into public.reservation_items values(v_id,(it->>'produit_id')::uuid,v_q,v_prix); v_total:=v_total+v_prix*v_q; end loop; update public.reservations set total=v_total where id=v_id; return v_id; end $fn$;
          create or replace function public.restore_stock(p_resa uuid) returns void language plpgsql security definer set search_path=public as $fn$ begin update public.stocks s set quantite=s.quantite+ri.quantite from public.reservation_items ri,public.reservations r where r.id=p_resa and ri.reservation_id=r.id and s.pharmacie_id=r.pharmacie_id and s.produit_id=ri.produit_id; end $fn$;
          create or replace function public.stocks_touch() returns trigger language plpgsql security definer set search_path=public as $fn$ begin new.updated_at:=now(); update public.pharmacies set stock_updated_at=now() where id=new.pharmacie_id; return new; end $fn$;
          """
          s += """
          create or replace function public.set_reservation_status(p_id uuid,p_statut resa_statut) returns void language plpgsql security definer set search_path=public as $fn$ declare r public.reservations; begin select * into r from public.reservations where id=p_id for update; if not found then raise exception 'Réservation introuvable'; end if; if not(is_admin() or r.pharmacie_id=my_pharmacie() or(r.client_id=auth.uid() and p_statut='annulee')) then raise exception 'Action non autorisée'; end if; if r.statut in('retiree','expiree','annulee') then raise exception 'Réservation déjà clôturée'; end if; if p_statut in('annulee','expiree') then perform restore_stock(p_id); end if; update public.reservations set statut=p_statut where id=p_id; end $fn$;
          create or replace function public.declare_payment(p_id uuid,p_ref text) returns void language plpgsql security definer set search_path=public as $fn$ begin update public.reservations set paiement_ref=p_ref where id=p_id and client_id=auth.uid() and statut in('en_attente','confirmee'); if not found then raise exception 'Réservation introuvable ou close'; end if; end $fn$;
          create or replace function public.expire_reservations() returns int language plpgsql security definer set search_path=public as $fn$ declare n int:=0; r record; begin for r in select id from public.reservations where statut in('en_attente','confirmee') and expires_at<now() for update skip locked loop perform restore_stock(r.id); update public.reservations set statut='expiree' where id=r.id; n:=n+1; end loop; return n; end $fn$;
          create or replace function public.set_garde(p_garde boolean) returns void language plpgsql security definer set search_path=public as $fn$ begin if my_pharmacie() is null then raise exception 'Réservé aux pharmacies'; end if; update public.pharmacies set de_garde=p_garde where id=my_pharmacie(); end $fn$;
          """
          s += "create or replace function public.handle_new_user() returns trigger language plpgsql security definer set search_path=public as $fn$ begin insert into public.profiles(id,role,username,first_name,last_name,phone,phone_country,date_of_birth,age_verified,consent_accepted_at) values(new.id,'client',lower(trim(new.raw_user_meta_data->>'username')),trim(new.raw_user_meta_data->>'first_name'),trim(new.raw_user_meta_data->>'last_name'),trim(new.raw_user_meta_data->>'phone'),upper(trim(new.raw_user_meta_data->>'phone_country')),(new.raw_user_meta_data->>'date_of_birth')::date,true,now()); return new; end $fn$;"
          s = s.replace("revoke all on function public.naxa_audit_session_insert() from public, anon, authenticated;", "")
          s = s.replace("revoke all on function public.naxa_audit_session_delete() from public, anon, authenticated;", "")
          p.write_text(s)
          PY
          n=1
          for f in supabase/migration_*.sql; do
            case "$(basename "$f")" in
              migration_020_architecture_privileges.sql) continue ;;
            esac
            ts=$(printf '2026100600%02d' "$n")
            cp "$f" "supabase/migrations/$ts"_"$(basename "$f")"
            n=$((n+1))
          done
          sed -i '/revoke all on function public.naxa_audit_session_insert()/d;/revoke all on function public.naxa_audit_session_delete()/d' supabase/migrations/*_migration_034_promoteur_session_audit.sql

      - name: Replay complet
        run: supabase start && supabase db reset

      - name: Vérification 7 — scope réseau
        run: docker exec -i supabase_db_naxa-pilotage-step1-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/032_promoteur_scope_reseau_7.sql

      - name: Vérification 8 — pilotage hors périmètre
        run: docker exec -i supabase_db_naxa-pilotage-step1-ci psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/033_promoteur_pilotage_hors_scope_8.sql

      - name: Arrêt propre
        if: always()
        run: supabase stop
