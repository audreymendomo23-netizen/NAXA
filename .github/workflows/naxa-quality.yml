name: NAXA quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: naxa-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, TypeScript et lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Tests + TypeScript + lint
        run: npm run quality
