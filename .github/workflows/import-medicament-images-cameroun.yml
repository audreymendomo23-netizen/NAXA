name: Importer les photos libres des médicaments prioritaires au Cameroun

on:
  push:
    branches: [main]
    paths:
      - "scripts/medicaments-images-cameroun.mjs"
      - ".github/workflows/import-medicament-images-cameroun.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre maximum de médicaments prioritaires à traiter (1–40)"
        required: false
        default: "40"

permissions:
  contents: read

concurrency:
  group: naxa-medicament-images-cameroun
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier la configuration Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::Secret NEXT_PUBLIC_SUPABASE_URL manquant" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "::error::Secret SUPABASE_SERVICE_ROLE_KEY manquant" && exit 1)
      - name: Importer les images avec licence compatible
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '40' }}"
          case "$LIMIT" in *[!0-9]*|'') LIMIT=40 ;; esac
          if [ "$LIMIT" -lt 1 ] || [ "$LIMIT" -gt 40 ]; then LIMIT=40; fi
          node scripts/medicaments-images-cameroun.mjs "--limit=$LIMIT"
