name: NAXA — Partie 3 Responsable — validation isolée
on:
  workflow_dispatch:
  pull_request:
    branches: [main, consolidation]
  push:
    branches: [feat/promoteur-partie3-responsable-accreditation-20261006]
jobs:
  partie3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Configurer Supabase local
        run: |
          cat > supabase/config.toml <<'EOF'
          project_id = "naxa-partie3-ci"
          [api]
          enabled = true
          [db]
          major_version = 17
          [studio]
          enabled = false
          [inbucket]
          enabled = false
          [storage]
          enabled = false
          [realtime]
          enabled = false
          [analytics]
          enabled = false
          [edge_runtime]
          enabled = false
          EOF
      - name: Préparer les migrations
        run: |
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          cp supabase/schema.sql supabase/migrations/20261006000000_base.sql
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("supabase/migrations/20261006000000_base.sql")
          s=p.read_text()
          s=re.sub(r"create or replace function handle_new_user.*?create trigger on_auth_user_created", """create or replace function handle_new_user() returns trigger language plpgsql security definer set search_path=public as $fn$ begin insert into profiles(id,role,username,first_name,last_name,date_of_birth,age_verified,consent_accepted_at) values(new.id,'client',lower(trim(new.raw_user_meta_data->>'username')),trim(new.raw_user_meta_data->>'first_name'),trim(new.raw_user_meta_data->>'last_name'),(new.raw_user_meta_data->>'date_of_birth')::date,false,null); return new; end; $fn$;
          create trigger on_auth_user_created""", s, flags=re.S)
          s=re.sub(r"create or replace function my_pharmacie.*?;", "create or replace function my_pharmacie() returns uuid language sql stable security definer set search_path=public as $fn$select pharmacie_id from profiles where id=auth.uid() and actif=true and role in ('pharmacie','promoteur','caisse');$fn$;", s, count=1, flags=re.S)
          p.write_text(s)
          PY
          n=1
          for f in supabase/migration_*.sql; do
            ts=$(printf '2026100600%02d' "$n")
            cp "$f" "supabase/migrations/"$ts"_$(basename "$f")"
            n=$((n+1))
          done
      - name: Démarrer Supabase local
        run: supabase start
      - name: Replay complet + migration 028
        run: supabase db reset
      - name: Assertions structurelles Partie 3
        run: supabase db query --file supabase/tests/028_promoteur_responsable_accreditation.sql
      - name: Tests comportementaux Partie 3
        run: supabase db query --file supabase/tests/028_promoteur_responsable_accreditation_behavior.sql
      - name: Arrêt propre
        if: always()
        run: supabase stop
