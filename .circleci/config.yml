version: 2.1

jobs:
  quality:
    docker:
      - image: cimg/node:20.14
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://build-test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-test-service-role-key
    steps:
      - checkout
      - run:
          name: Installer les dépendances
          command: npm install --no-audit --no-fund
      - run:
          name: TypeScript
          command: npx tsc --noEmit
      - run:
          name: ESLint
          command: npm run lint
      - run:
          name: Build Next.js
          command: npm run build

  sql_tests:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Préflight intégrité SQL N4
          command: |
            set -uo pipefail
            echo "PREFLIGHT_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "HEAD=$(git rev-parse HEAD)"
            echo "BRANCH=$CIRCLE_BRANCH"
            python3 - \<<'PY'
            import re
            from pathlib import Path

            failures = []

            def line_number(content, offset):
                return content.count("\n", 0, offset) + 1

            def check(label, found, expected, locations=None):
                locations = locations or []
                print(f"CHECK: {label}")
                print(f"TROUVÉ: {found}; attendu: {expected}")
                print("LIGNES: " + (", ".join(map(str, locations)) if locations else "—"))
                if found == expected:
                    print(f"PASS: {label}")
                else:
                    detail = f"{label} (trouvé {found}, attendu {expected})"
                    print(f"FAIL: {detail}")
                    failures.append(detail)

            schema = Path("supabase/schema.sql")
            schema_text = schema.read_text(encoding="utf-8") if schema.is_file() else ""
            check(
                "schema.sql présent et non vide",
                int(schema.is_file() and bool(schema_text.strip())),
                1,
                [1] if schema.is_file() and schema_text.strip() else [],
            )

            definitions = [
                (
                    "my_pharmacie() : une définition attendue",
                    re.compile(r"\bcreate\s+or\s+replace\s+function\s+(?:public\s*\.\s*)?my_pharmacie\s*\(", re.I),
                    1,
                ),
                (
                    "restore_stock( : une définition attendue",
                    re.compile(r"\bcreate\s+or\s+replace\s+function\s+(?:public\s*\.\s*)?restore_stock\s*\(", re.I),
                    1,
                ),
                (
                    "expire_reservations() : une définition attendue",
                    re.compile(r"\bcreate\s+or\s+replace\s+function\s+(?:public\s*\.\s*)?expire_reservations\s*\(", re.I),
                    1,
                ),
                (
                    "on_auth_user_created : un trigger attendu",
                    re.compile(r"\bcreate\s+trigger\s+on_auth_user_created\b", re.I),
                    1,
                ),
            ]
            for label, pattern, expected in definitions:
                matches = list(pattern.finditer(schema_text))
                check(label, len(matches), expected, [line_number(schema_text, m.start()) for m in matches])

            migration_files = sorted(Path("supabase").glob("migration_*.sql"))
            test_files = sorted(Path("supabase/tests").rglob("*.sql"))
            sql_files = ([schema] if schema.is_file() else []) + migration_files + test_files
            check("Au moins un fichier SQL à inspecter", int(bool(sql_files)), 1, [len(sql_files)] if sql_files else [])

            empty_tests = [str(p) for p in test_files if not p.read_text(encoding="utf-8").strip()]
            check("Tests SQL vides", len(empty_tests), 0, empty_tests)

            malformed_as = []
            malformed_dollar = []
            unmatched_dollar = []
            token_re = re.compile(r"\$(?:[A-Za-z_][A-Za-z0-9_]*)?\$")
            invalid_as_re = re.compile(r"\bas\s+\$[A-Za-z_][A-Za-z0-9_]*(?=\s|;|,|$)", re.I)

            for path in sql_files:
                content = path.read_text(encoding="utf-8")
                for match in invalid_as_re.finditer(content):
                    malformed_as.append(f"{path}:{line_number(content, match.start())}: AS suivi d'un délimiteur dollar invalide ({match.group(0)})")
                for line_no, line in enumerate(content.splitlines(), 1):
                    if re.search(r"(?<![A-Za-z0-9_$])\$;", line):
                        malformed_dollar.append(f"{path}:{line_no}: délimiteur malformé $;")

                tokens = list(token_re.finditer(content))
                i = 0
                while i < len(tokens):
                    opening = tokens[i]
                    closing_index = next(
                        (j for j in range(i + 1, len(tokens)) if tokens[j].group(0) == opening.group(0)),
                        None,
                    )
                    if closing_index is None:
                        unmatched_dollar.append(
                            f"{path}:{line_number(content, opening.start())}: délimiteur {opening.group(0)} non apparié"
                        )
                        break
                    i = closing_index + 1

            check("Occurrences « as $select » / délimiteur dollar invalide", len(malformed_as), 0, malformed_as)
            check("Occurrences « as $; » / délimiteur malformé", len(malformed_dollar), 0, malformed_dollar)
            check("Délimiteurs dollar non appariés", len(unmatched_dollar), 0, unmatched_dollar)

            duplicate_prefixes = {}
            for path in migration_files:
                match = re.match(r"migration_(\d+[a-z]?)_", path.name, re.I)
                if match:
                    duplicate_prefixes.setdefault(match.group(1).lower(), []).append(path.name)
            duplicates = {k: v for k, v in duplicate_prefixes.items() if len(v) > 1}
            print(f"INFO: {len(migration_files)} migrations sources ; {len(test_files)} tests SQL.")
            if duplicates:
                print("INFO: préfixes sources répétés (les noms de rejeu seront uniques) :")
                for prefix, names in sorted(duplicates.items()):
                    print(f"  {prefix}: {', '.join(names)}")

            if failures:
                print(f"RÉCAPITULATIF : {len(failures)} contrôle(s) en échec")
                for failure in failures:
                    print(f" - {failure}")
                raise SystemExit(1)
            print("SQL preflight: OK — tous les contrôles exécutés sont conformes")
            PY
      - run:
          name: Installer les dépendances frontend
          command: npm install --no-audit --no-fund
      - run:
          name: Préparer Supabase local
          command: |
            set -euo pipefail
            export LC_ALL=C
            echo "Locale de rejeu: LC_ALL=$LC_ALL"
            echo "Supabase CLI version: $(npx supabase@latest --version)"
            npx supabase@latest init --force
            cat > supabase/config.toml \<<'EOF'
            project_id = "naxa-tests-ci"
            [api]
            enabled = true
            [db]
            major_version = 17
            [studio]
            enabled = false
            EOF
            rm -rf supabase/migrations
            mkdir -p supabase/migrations
            cp supabase/schema.sql supabase/migrations/20261006000000_base.sql
            shopt -s nullglob
            migration_files=(supabase/migration_*.sql)
            n=1
            for f in "${migration_files[@]}"; do
              ts=$(printf '202610060000%02d' "$n")
              cp "$f" "supabase/migrations/${ts}_$(basename "$f")"
              n=$((n+1))
            done
            echo "Migrations préparées pour le rejeu (ordre alphabétique source) :"
            find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
      - run:
          name: Démarrer Supabase local
          command: npx supabase@latest start -x studio -x mailpit -x realtime -x imgproxy -x kong -x postgrest -x postgres-meta -x edge-runtime -x logflare -x vector -x supavisor
      - run:
          name: Vérifier la disponibilité SQL locale
          command: |
            set -uo pipefail
            cat > /tmp/naxa-db-ready.sql \<<'SQL'
            select 1 as naxa_db_ready;
            SQL
            ready=0
            for attempt in $(seq 1 30); do
              if npx supabase@latest db query --local --file /tmp/naxa-db-ready.sql > /tmp/naxa-db-ready.log 2>&1; then
                cat /tmp/naxa-db-ready.log
                ready=1
                break
              fi
              echo "Base locale pas encore prête (${attempt}/30)"
              sleep 2
            done
            if [[ "$ready" -ne 1 ]]; then
              echo "FAIL: la base SQL locale n'est pas devenue disponible après 60 secondes"
              cat /tmp/naxa-db-ready.log
              exit 1
            fi
      - run:
          name: Replay complet des migrations
          command: |
            set -uo pipefail
            if npx supabase@latest db reset 2>&1 | tee /tmp/naxa-sql-replay.log; then
              echo "Replay complet: PASS"
            else
              rc=${PIPESTATUS[0]}
              printf '%s\n' "$rc" > /tmp/naxa-sql-replay.fail
              exit "$rc"
            fi
      - run:
          name: Exécuter tous les tests SQL
          command: |
            set -uo pipefail
            exec > >(tee /tmp/naxa-sql-tests.log) 2>&1
            rm -f /tmp/naxa-sql-tests.fail
            TEST_FAILS=()
            shopt -s nullglob
            test_files=(supabase/tests/*.sql)
            if [[ "${#test_files[@]}" -eq 0 ]]; then
              echo "FAIL: aucun test SQL trouvé dans supabase/tests/*.sql"
              exit 1
            fi
            for f in "${test_files[@]}"; do
              echo "=== TEST $f ==="
              out="$(mktemp)"
              if npx supabase@latest db query --local --file "$f" 2>&1 | tee "$out"; then
                if grep -Eiq '(^|[^[:alnum:]_])(false|f)([^[:alnum:]_]|$)' "$out"; then
                  echo "FAIL: assertion booléenne fausse dans $f"
                  TEST_FAILS+=("$f : assertion booléenne fausse")
                else
                  echo "PASS: $f"
                fi
              else
                echo "FAIL: exécution SQL en erreur pour $f"
                TEST_FAILS+=("$f : commande SQL en erreur")
              fi
              rm -f "$out"
            done
            if [[ "${#TEST_FAILS[@]}" -gt 0 ]]; then
              echo "RÉCAPITULATIF : ${#TEST_FAILS[@]} test(s) en échec"
              printf ' - %s\\n' "${TEST_FAILS[@]}"
              : > /tmp/naxa-sql-tests.fail
              exit 1
            fi
            echo "SQL tests: OK — tous les tests exécutés"
      - run:
          name: Arrêter Supabase local
          command: npx supabase@latest stop --no-backup
          when: always

workflows:
  quality_and_tests:
    jobs:
      - quality
      - sql_tests:
          requires:
            - quality
