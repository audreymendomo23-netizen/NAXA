version: 2.1

jobs:
  quality:
    docker:
      - image: cimg/node:20.14
    steps:
      - checkout
      - run:
          name: Installer les dépendances
          command: npm install --no-audit --no-fund
      - run:
          name: TypeScript
          command: npx tsc --noEmit
      - run:
          name: ESLint
          command: npm run lint
      - run:
          name: Build Next.js
          command: npm run build

workflows:
  quality:
    jobs:
      - quality
