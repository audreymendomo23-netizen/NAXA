name: Android native build
on:
  push:
    branches: [main]
    paths:
      - "android/payment-companion/**"
      - ".github/workflows/android-native-build.yml"
  pull_request:
    paths:
      - "android/payment-companion/**"
      - ".github/workflows/android-native-build.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: naxa-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Kotlin compile and unit tests · standard + admin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable dans $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Compile, test and assemble both private variants
        working-directory: android/payment-companion
        run: |
          gradle --no-daemon --stacktrace \
            :app:testStandardDebugUnitTest :app:assembleStandardDebug \
            :app:testAdminDebugUnitTest :app:assembleAdminDebug
      - name: Publish internal debug APKs only
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: naxa-payment-companion-private-debug-variants
          path: |
            android/payment-companion/app/build/outputs/apk/standard/debug/app-standard-debug.apk
            android/payment-companion/app/build/outputs/apk/admin/debug/app-admin-debug.apk
          if-no-files-found: error
          retention-days: 7
