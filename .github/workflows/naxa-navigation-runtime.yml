name: NAXA Navigation runtime E2E (Replay, no new Auth users)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/naxa-navigation-runtime.yml"
      - ".github/e2e/naxa-navigation-runtime.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxa-navigation-runtime-replay
  cancel-in-progress: false

jobs:
  navigation-runtime:
    name: Menus Promoteur, Comptable et Partenaire via Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NAXA_STORAGE_E2E_URL: ${{ secrets.NAXA_STORAGE_E2E_URL }}
      NAXA_STORAGE_E2E_ANON_KEY: ${{ secrets.NAXA_STORAGE_E2E_ANON_KEY }}
      NAXA_STORAGE_E2E_ADMIN_KEY: ${{ secrets.NAXA_STORAGE_E2E_ADMIN_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NAXA_STORAGE_E2E_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NAXA_STORAGE_E2E_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.NAXA_STORAGE_E2E_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.NAXA_STORAGE_E2E_ADMIN_KEY }}
      NAXA_E2E_WEB_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Préflight strict Replay
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NAXA_STORAGE_E2E_URL"
          test -n "$NAXA_STORAGE_E2E_ANON_KEY"
          test -n "$NAXA_STORAGE_E2E_ADMIN_KEY"
          case "$NAXA_STORAGE_E2E_URL" in
            https://pwfftcsjyeibxxqhwysw.supabase.co) ;;
            *) echo "::error::Projet non-Replay refusé. Aucune écriture ne sera faite."; exit 1 ;;
          esac
          echo "::add-mask::$NAXA_STORAGE_E2E_ADMIN_KEY"
          echo "::notice::Projet Replay strictement épinglé : pwfftcsjyeibxxqhwysw"

      - name: Installer les dépendances du dépôt
        run: npm ci --no-audit --no-fund

      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium

      - name: Vérifier la syntaxe du script de recette
        run: node --check .github/e2e/naxa-navigation-runtime.cjs

      - name: Générer un secret temporaire de limitation de débit
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "NAXA_RATE_LIMIT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Construire NAXA (build local, sans déploiement)
        run: npm run build

      - name: Démarrer NAXA localement et exécuter les clics Chromium sur Replay
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/naxa-navigation-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/naxa-navigation-server.log"
            exit 1
          fi
          node .github/e2e/naxa-navigation-runtime.cjs

      - name: Nettoyer toujours les fixtures métier Replay temporaires
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/naxa-navigation-runtime-state.json"
          if [ -f "$state_file" ]; then
            node .github/e2e/naxa-navigation-runtime.cjs --cleanup
          else
            echo "Aucune fixture temporaire restante dans le runner."
          fi
