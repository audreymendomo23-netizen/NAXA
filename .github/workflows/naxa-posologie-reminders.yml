name: NAXA — Rappels de posologie

on:
  schedule:
    # GitHub Actions permet une planification périodique gratuite ; le service peut démarrer avec retard.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxa-posologie-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Vérifier la configuration
        env:
          CRON_URL: ${{ vars.NAXA_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_URL" || { echo "Variable NAXA_CRON_URL manquante"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Secret CRON_SECRET manquant"; exit 1; }
          case "$CRON_URL" in
            https://*) ;;
            *) echo "NAXA_CRON_URL doit utiliser HTTPS"; exit 1 ;;
          esac
      - name: Déclencher les rappels
        env:
          CRON_URL: ${{ vars.NAXA_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +x
          curl --fail-with-body --silent --show-error \
            --max-time 50 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Accept: application/json" \
            "$CRON_URL"
