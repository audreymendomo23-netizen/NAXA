name: NAXA GitHub Actions validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxa-actions-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Validate workflow syntax and expressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          "$HOME/go/bin/actionlint" -version

      - name: Lint every active GitHub Actions workflow
        run: "$HOME/go/bin/actionlint" -color .github/workflows/*.yml
