version: 2.1

jobs:
  quality:
    docker:
      - image: cimg/node:20.14
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://build-test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-test-service-role-key
    steps:
      - checkout
      - run:
          name: Installer les dépendances
          command: npm install --no-audit --no-fund
      - run:
          name: TypeScript
          command: npx tsc --noEmit
      - run:
          name: ESLint
          command: npm run lint
      - run:
          name: Build Next.js
          command: npm run build

  sql_tests:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Préflight intégrité SQL N4
          command: |
            set -euo pipefail
            echo "HEAD=$(git rev-parse HEAD)"
            echo "BRANCH=${CIRCLE_BRANCH:-unknown}"
            test -s supabase/schema.sql
            test "$(grep -Fc 'create or replace function my_pharmacie()' supabase/schema.sql)" -eq 1
            test "$(grep -Fc 'create or replace function restore_stock(' supabase/schema.sql)" -eq 1
            test "$(grep -Fc 'create or replace function expire_reservations()' supabase/schema.sql)" -eq 1
            test "$(grep -Fc 'create trigger on_auth_user_created' supabase/schema.sql)" -eq 1
            test "$(grep -Fc 'as $select' supabase/schema.sql)" -eq 0
            test "$(grep -Fc 'as $;' supabase/schema.sql)" -eq 0
            restore_line="$(grep -nF 'create or replace function restore_stock(' supabase/schema.sql | cut -d: -f1)"
            restore_revoke_line="$(grep -nF 'revoke execute on function restore_stock(uuid)' supabase/schema.sql | cut -d: -f1)"
            test -n "$restore_line" && test -n "$restore_revoke_line" && test "$restore_revoke_line" -gt "$restore_line"
            expire_line="$(grep -nF 'create or replace function expire_reservations()' supabase/schema.sql | cut -d: -f1)"
            expire_revoke_line="$(grep -nF 'revoke execute on function expire_reservations()' supabase/schema.sql | cut -d: -f1)"
            test -n "$expire_line" && test -n "$expire_revoke_line" && test "$expire_revoke_line" -gt "$expire_line"
            # Garde de dépendances : 013 doit fournir le prédicat minimal avant
            # que 016 ne le remplace par la sémantique multi-pharmacie canonique.
            access_bootstrap_line="$(grep -nF 'create or replace function public.can_access_pharmacy' supabase/migration_013_stocks_couts.sql | cut -d: -f1)"
            access_first_use_line="$(grep -nF 'public.can_access_pharmacy(' supabase/migration_013_stocks_couts.sql | head -1 | cut -d: -f1)"
            test -n "$access_bootstrap_line" && test -n "$access_first_use_line" && test "$access_first_use_line" -gt "$access_bootstrap_line"
            # L'ancien nom profile_privileges est interdit : le modèle canonique est naxa_profile_privileges.
            if grep -R -nF 'public.profile_privileges' supabase/migration_*.sql; then
              echo "ÉCHEC: référence legacy public.profile_privileges détectée"
              exit 1
            fi
            echo "SQL preflight: OK"
      - run:
          name: Installer les dépendances frontend
          command: npm install --no-audit --no-fund
      - run:
          name: Préparer Supabase local
          command: |
            npx supabase@latest init --force
            cat > supabase/config.toml \<<'EOF'
            project_id = "naxa-tests-ci"
            [api]
            enabled = true
            [db]
            major_version = 17
            [studio]
            enabled = false
            EOF
            rm -rf supabase/migrations
            mkdir -p supabase/migrations
            cp supabase/schema.sql supabase/migrations/20261006000000_base.sql
            n=1
            for f in supabase/migration_*.sql; do
              ts=$(printf '202610060000%02d' "$n")
              cp "$f" "supabase/migrations/${ts}_$(basename "$f")"
              n=$((n+1))
            done
      - run:
          name: Démarrer Supabase local
          command: npx supabase@latest start -x studio -x mailpit -x storage-api -x realtime
      - run:
          name: Replay complet des migrations
          command: npx supabase@latest db reset
      - run:
          name: Exécuter tous les tests SQL
          command: |
            set -e
            for f in supabase/tests/*.sql; do
              echo "=== TEST $f ==="
              out="$(mktemp)"
              npx supabase@latest db query --file "$f" 2>&1 | tee "$out"
              if grep -Eq '(^|[[:space:]])f([[:space:]]|$)' "$out"; then
                echo "ÉCHEC: au moins une assertion booléenne est fausse dans $f"
                rm -f "$out"
                exit 1
              fi
              rm -f "$out"
            done
      - run:
          name: Arrêter Supabase local
          command: npx supabase@latest stop --no-backup
          when: always

workflows:
  quality_and_tests:
    jobs:
      - quality
      - sql_tests:
          requires:
            - quality
