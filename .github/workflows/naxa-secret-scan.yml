name: NAXA secret scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/naxa-secret-scan.yml"
      - ".github/workflows/android-native-build.yml"
      - ".gitleaks.toml"
      - "android/**"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Full history, branches and archives
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch every remote branch and tag
        run: git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Scan all Git refs, commits and nested archives
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --log-opts=--all --max-archive-depth=2
      - name: Scan current working tree and nested archives
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --redact --verbose --max-archive-depth=2
