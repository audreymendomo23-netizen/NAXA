version: 2.1

jobs:
  quality:
    docker:
      - image: cimg/node:20.14
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://build-test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-test-service-role-key
    steps:
      - checkout
      - run:
          name: Installer les dépendances
          command: npm install --no-audit --no-fund
      - run:
          name: TypeScript
          command: npx tsc --noEmit
      - run:
          name: Build Next.js
          command: npm run build

  sql_tests:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Préflight intégrité SQL N4
          command: |
            set -uo pipefail
            echo "HEAD=$(git rev-parse HEAD)"
            echo "BRANCH=${CIRCLE_BRANCH:-unknown}"
            FAILS=()
            check() {
              local label="$1"
              shift
              echo "CHECK: $label"
              if "$@"; then
                echo "PASS: $label (résultat conforme)"
              else
                echo "FAIL: $label (résultat non conforme)"
                FAILS+=("$label")
              fi
              return 0
            }
            check_count() {
              local label="$1" expected="$2" pattern="$3" file="$4" count
              echo "CHECK: $label"
              count="$(grep -Eic -- "$pattern" "$file" || true)"
              echo "TROUVÉ: $count ligne(s) correspondante(s) ; attendu: $expected"
              echo "LIGNES:"
              grep -Ein -- "$pattern" "$file" || true
              if [[ "$count" -eq "$expected" ]]; then
                echo "PASS: $label"
              else
                echo "FAIL: $label (trouvé $count, attendu $expected)"
                FAILS+=("$label (trouvé $count, attendu $expected)")
              fi
              return 0
            }
            check "schema.sql présent et non vide" test -s supabase/schema.sql
            check_count "my_pharmacie() : une définition attendue" 1 '^[[:space:]]*create[[:space:]]+or[[:space:]]+replace[[:space:]]+function[[:space:]]+(public[[:space:]]*\.[[:space:]]*)?my_pharmacie[[:space:]]*\(' supabase/schema.sql
            check_count "restore_stock( : une définition attendue" 1 '^[[:space:]]*create[[:space:]]+or[[:space:]]+replace[[:space:]]+function[[:space:]]+(public[[:space:]]*\.[[:space:]]*)?restore_stock[[:space:]]*\(' supabase/schema.sql
            check_count "expire_reservations() : une définition attendue" 1 '^[[:space:]]*create[[:space:]]+or[[:space:]]+replace[[:space:]]+function[[:space:]]+(public[[:space:]]*\.[[:space:]]*)?expire_reservations[[:space:]]*\(' supabase/schema.sql
            check_count "on_auth_user_created : un trigger attendu" 1 '^[[:space:]]*create[[:space:]]+trigger[[:space:]]+on_auth_user_created([[:space:]]|$)' supabase/schema.sql
            check_count 'as $select : zéro occurrence attendue' 0 'as[[:space:]]+\$select([[:space:]]|$)' supabase/schema.sql
            check_count 'as $; : zéro occurrence attendue' 0 'as[[:space:]]+\$;' supabase/schema.sql
            check "Délimiteurs dollar et blocs SQL valides (schéma, migrations, tests)" python3 - <<'PY'
            import re
            from collections import Counter
            from pathlib import Path

            files = [Path("supabase/schema.sql")]
            files += sorted(Path("supabase").glob("migration_*.sql"))
            files += sorted(Path("supabase/tests").rglob("*.sql"))
            errors = []
            token_re = re.compile(r"\$(?:[A-Za-z_][A-Za-z0-9_]*)?\$")
            invalid_as_re = re.compile(r"\bas\s+\$[A-Za-z_][A-Za-z0-9_]*(?=\s|;|,|$)", re.I)

            for path in files:
                content = path.read_text(encoding="utf-8")
                for line_no, line in enumerate(content.splitlines(), 1):
                    if "$;" in line:
                        errors.append(f"{path}:{line_no}: délimiteur malformé $;")
                    if invalid_as_re.search(line):
                        errors.append(f"{path}:{line_no}: ouverture dollar-quote invalide après AS")
                counts = Counter(token_re.findall(content))
                for token, count in counts.items():
                    if count % 2:
                        errors.append(f"{path}: délimiteur {token} non apparié ({count} occurrence(s))")

            if errors:
                print("\n".join(errors))
                raise SystemExit(1)
            print(f"PASS: {len(files)} fichiers SQL inspectés, délimiteurs appariés")
            PY
            if (( ${#FAILS[@]} > 0 )); then
              echo "RÉCAPITULATIF : ${#FAILS[@]} contrôle(s) en échec"
              printf ' - %s\n' "${FAILS[@]}"
              exit 1
            fi
            echo "SQL preflight: OK — tous les contrôles sont verts"
      - run:
          name: Installer les dépendances frontend
          command: npm install --no-audit --no-fund
      - run:
          name: Préparer Supabase local
          command: |
            echo "Supabase CLI version: $(npx supabase@latest --version)"
            npx supabase@latest init --force
            cat > supabase/config.toml \<<'EOF'
            project_id = "naxa-tests-ci"
            [api]
            enabled = true
            [db]
            major_version = 17
            [studio]
            enabled = false
            EOF
            rm -rf supabase/migrations
            mkdir -p supabase/migrations
            cp supabase/schema.sql supabase/migrations/20261006000000_base.sql
            n=1
            for f in supabase/migration_*.sql; do
              ts=$(printf '202610060000%02d' "$n")
              cp "$f" "supabase/migrations/${ts}_$(basename "$f")"
              n=$((n+1))
            done
      - run:
          name: Démarrer Supabase local
          command: npx supabase@latest start -x studio -x mailpit -x realtime -x imgproxy -x kong -x postgrest -x postgres-meta -x edge-runtime -x logflare -x vector -x supavisor
      - run:
          name: Replay complet des migrations
          command: npx supabase@latest db reset
      - run:
          name: Exécuter tous les tests SQL
          command: |
            set -euo pipefail
            for f in supabase/tests/*.sql; do
              echo "=== TEST $f ==="
              out="$(mktemp)"
              npx supabase@latest db query --local --file "$f" 2>&1 | tee "$out"
              if grep -Eiq '(^|[^[:alnum:]_])(false|f)([^[:alnum:]_]|$)' "$out"; then
                echo "ÉCHEC: au moins une assertion booléenne est fausse dans $f"
                rm -f "$out"
                exit 1
              fi
              rm -f "$out"
            done
      - run:
          name: Arrêter Supabase local
          command: npx supabase@latest stop --no-backup
          when: always

workflows:
  quality_and_tests:
    jobs:
      - quality
      - sql_tests:
          requires:
            - quality