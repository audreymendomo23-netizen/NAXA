name: NAXA Replay Support, Livechat, Audio and Screen Share E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/naxa-support-livechat-e2e.yml"
      - "scripts/e2e/naxa-support-livechat-browser.cjs"
      - "scripts/test-client-naxa-assistance.cjs"
      - "scripts/e2e/naxa-professional-support-browser.cjs"
      - "scripts/e2e/naxa-support-agent-browser.cjs"
      - "scripts/test-support-audio.cjs"
      - "src/app/api/auth/login/route.ts"
      - "src/app/api/auth/username-recognition/route.ts"
      - "src/app/api/admin/support-agents/**"
      - "src/app/api/support-agent/**"
      - "src/app/api/support/**"
      - "src/app/equipe-support/**"
      - "src/app/activation-agent/**"
      - "src/components/admin/AdminSupportAgents.tsx"
      - "src/components/support/**"
      - "src/middleware.ts"
      - "src/components/NaxaSupportWidget.tsx"
      - "src/components/ParcoursClientShell.tsx"
      - "src/components/admin/AdminInbox.tsx"
      - "src/app/admin/messagerie/**"
      - "src/app/api/admin/messagerie/**"
      - "src/app/assistance/**"
      - "src/app/faq/**"
      - "src/components/FaqInteractive.tsx"
      - "src/app/aide/**"
      - "supabase/migrations/*naxa*support*"
      - "supabase/tests/*naxa*support*"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxa-replay-support-livechat-e2e-v2
  cancel-in-progress: false

jobs:
  support-livechat-browser:
    name: Client ↔ Admin — Chromium sur Replay
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NAXA_STORAGE_E2E_URL: ${{ secrets.NAXA_STORAGE_E2E_URL }}
      NAXA_STORAGE_E2E_ANON_KEY: ${{ secrets.NAXA_STORAGE_E2E_ANON_KEY }}
      NAXA_STORAGE_E2E_ADMIN_KEY: ${{ secrets.NAXA_STORAGE_E2E_ADMIN_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NAXA_STORAGE_E2E_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NAXA_STORAGE_E2E_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.NAXA_STORAGE_E2E_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NAXA_STORAGE_E2E_ADMIN_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Vérifier les secrets et refuser Production
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NAXA_STORAGE_E2E_URL"
          test -n "$NAXA_STORAGE_E2E_ANON_KEY"
          test -n "$NAXA_STORAGE_E2E_ADMIN_KEY"
          test "$NAXA_STORAGE_E2E_URL" = "https://pwfftcsjyeibxxqhwysw.supabase.co"
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install chromium
      - name: Démarrer TURN éphémère pour la preuve WebRTC
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y coturn
          # Debian peut démarrer le service système au post-install. On l'arrête
          # avant de lancer l'instance de recette avec notre secret éphémère.
          sudo systemctl stop coturn.service 2>/dev/null || true
          sudo service coturn stop 2>/dev/null || true
          sudo pkill -x turnserver 2>/dev/null || true
          TURN_SECRET="$(openssl rand -hex 32)"
          TURN_PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          echo "::add-mask::$TURN_SECRET"
          {
            echo "NAXA_TURN_URLS=turn:127.0.0.1:$TURN_PORT?transport=udp"
            echo "NAXA_TURN_SHARED_SECRET=$TURN_SECRET"
            echo "NAXA_TURN_CREDENTIAL_TTL_SECONDS=300"
          } >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/coturn.conf" <<EOF
          listening-ip=127.0.0.1
          relay-ip=127.0.0.1
          listening-port=$TURN_PORT
          min-port=49160
          max-port=49200
          realm=naxa-replay-e2e.local
          fingerprint
          use-auth-secret
          static-auth-secret=$TURN_SECRET
          allow-loopback-peers
          no-multicast-peers
          no-cli
          no-tls
          no-dtls
          simple-log
          log-file=$RUNNER_TEMP/coturn.log
          EOF
          turnserver -c "$RUNNER_TEMP/coturn.conf" > "$RUNNER_TEMP/coturn.stdout.log" 2>&1 &
          TURN_PID=$!
          echo "$TURN_PID" > "$RUNNER_TEMP/coturn.pid"
          ready=0
          for _ in $(seq 1 30); do
            if kill -0 "$TURN_PID" 2>/dev/null; then
              SOCKETS="$(ss -H -lunp "sport = :$TURN_PORT" 2>/dev/null || true)"
              if echo "$SOCKETS" | grep -q "pid=$TURN_PID"; then
                ready=1
                break
              fi
            else
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "PID attendu : $TURN_PID ; port attendu : $TURN_PORT"
            pgrep -a -x turnserver || true
            ss -lntup || true
            cat "$RUNNER_TEMP/coturn.stdout.log" "$RUNNER_TEMP/coturn.log" 2>/dev/null || true
            echo "::error::L'instance TURN personnalisée n'est pas propriétaire de son socket UDP."
            exit 1
          fi
          echo "TURN éphémère prêt : port UDP $TURN_PORT, PID $TURN_PID."
      - name: Construire NAXA avec la configuration Replay
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_SECRET_KEY="$NAXA_STORAGE_E2E_ADMIN_KEY"
          NAXA_RATE_LIMIT_SECRET="$(openssl rand -hex 32)"
          export NAXA_RATE_LIMIT_SECRET
          echo "::add-mask::$SUPABASE_SECRET_KEY"
          echo "::add-mask::$NAXA_RATE_LIMIT_SECRET"
          npm run build
      - name: Démarrer le serveur local de recette
        env:
          NAXA_E2E_WEB_BASE_URL: http://127.0.0.1:3000
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_SECRET_KEY="$NAXA_STORAGE_E2E_ADMIN_KEY"
          NAXA_RATE_LIMIT_SECRET="$(openssl rand -hex 32)"
          export NAXA_RATE_LIMIT_SECRET
          npm start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/naxa-support-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/naxa-support-server.pid"
          ready=0
          for _ in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:3000/connexion >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 160 "$RUNNER_TEMP/naxa-support-server.log" || true
            echo "::error::Le serveur local NAXA n'a pas démarré."
            exit 1
          fi
      - name: Recette réelle Client ↔ Admin, Realtime, statuts, fichiers et /aide
        if: ${{ !contains(github.event.head_commit.message, '[agents-only]') && !contains(github.event.head_commit.message, '[support-team-only]') }}
        env:
          NAXA_E2E_WEB_BASE_URL: http://127.0.0.1:3000
        run: node scripts/e2e/naxa-support-livechat-browser.cjs
      - name: Recette navigateur Promoteur et Livreur ↔ Admin
        if: ${{ !contains(github.event.head_commit.message, '[agents-only]') }}
        env:
          NAXA_E2E_WEB_BASE_URL: http://127.0.0.1:3000
        run: node scripts/e2e/naxa-professional-support-browser.cjs
      - name: Recette navigateur Agents NAXA — comptes, permissions, RLS, Livechat et cycle de vie
        env:
          NAXA_E2E_WEB_BASE_URL: http://127.0.0.1:3000
        run: node scripts/e2e/naxa-support-agent-browser.cjs
      - name: Nettoyage de secours des comptes et tickets Agents Replay
        if: always()
        run: node scripts/e2e/naxa-support-agent-browser.cjs --cleanup
      - name: Nettoyage de secours des recettes professionnelles Replay
        if: always()
        run: node scripts/e2e/naxa-professional-support-browser.cjs --cleanup
      - name: Nettoyage de secours Replay
        if: always()
        run: node scripts/e2e/naxa-support-livechat-browser.cjs --cleanup
      - name: Logs serveur si échec
        if: failure()
        shell: bash
        run: |
          echo "::group::Logs serveur NAXA Support E2E"
          tail -n 160 "$RUNNER_TEMP/naxa-support-server.log" || true
          echo "::group::Logs relais TURN"
          tail -n 160 "$RUNNER_TEMP/coturn.stdout.log" "$RUNNER_TEMP/coturn.log" 2>/dev/null || true
          echo "::endgroup::"
          echo "::endgroup::"
      - name: Arrêter le serveur local
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/naxa-support-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/naxa-support-server.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/coturn.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/coturn.pid")" 2>/dev/null || true
          fi
