permissions:
  contents: read

concurrency:
  group: naxa-replay-promoteur-secret-safe-v2
  cancel-in-progress: false

jobs:
  provision-and-verify:
    name: Promoteur, logo pharmacy upsert et isolation inter-pharmacies
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NAXA_STORAGE_E2E_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NAXA_STORAGE_E2E_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.NAXA_STORAGE_E2E_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NAXA_STORAGE_E2E_ADMIN_KEY }}
      NAXA_STORAGE_E2E_URL: ${{ secrets.NAXA_STORAGE_E2E_URL }}
      NAXA_STORAGE_E2E_ANON_KEY: ${{ secrets.NAXA_STORAGE_E2E_ANON_KEY }}
      NAXA_STORAGE_E2E_ADMIN_KEY: ${{ secrets.NAXA_STORAGE_E2E_ADMIN_KEY }}
      NAXA_STORAGE_E2E_ADMIN_EMAIL: naxa.e2e.20261104.admin@example.invalid
      NAXA_STORAGE_E2E_PROMOTEUR_EMAIL: naxa.e2e.promoteur@example.invalid
      NAXA_STORAGE_E2E_REQUIRE_ROLE_MATRIX: "1"
    steps:
      - name: Checkout source main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Tester les contrats des parcours Auth et des fixtures Replay
        run: node --test scripts/test-auth-path-contract.cjs scripts/test-replay-promoteur-safe-v2.cjs scripts/test-replay-admin-safe.cjs scripts/test-replay-livreur-safe.cjs scripts/test-replay-pharmacy-staff-safe.cjs scripts/test-caisse-provisioning-action.cjs scripts/test-caisse-provisioning-sql.cjs scripts/test-stock-assignment-read-rls.cjs scripts/test-products-public-rls.cjs scripts/test-marketplace-offer-rpc-security.cjs scripts/test-admin-produits-actions.cjs scripts/test-pharmacy-led-product-publication.cjs scripts/test-assurance-amount-proposals.cjs scripts/test-assurance-import-membership.cjs scripts/test-pharmacy-product-source-check.cjs scripts/test-promoter-product-read-policy.cjs scripts/test-pharmacy-lot-expiry-notifications.cjs scripts/test-replay-expiry-provisioner.cjs scripts/test-replay-expiry-push-worker.cjs scripts/test-replay-expiry-stock-aggregate.cjs scripts/test-stock-lot-delete-audit.cjs scripts/test-pos-internal-stock-scope.cjs scripts/test-credit-refund-runtime.cjs scripts/test-caisse-unpublished-pharmacy-access.cjs scripts/test-credit-pharmacy-provisioner.cjs scripts/test-credit-pos-browser.cjsscripts/test-replay-promoteur-safe-v2.cjs scripts/test-replay-admin-safe.cjs scripts/test-replay-livreur-safe.cjs scripts/test-replay-pharmacy-staff-safe.cjs scripts/test-caisse-provisioning-action.cjs scripts/test-caisse-provisioning-sql.cjs scripts/test-stock-assignment-read-rls.cjs scripts/test-products-public-rls.cjs scripts/test-marketplace-offer-rpc-security.cjs scripts/test-admin-produits-actions.cjs scripts/test-pharmacy-led-product-publication.cjs scripts/test-assurance-amount-proposals.cjs scripts/test-assurance-import-membership.cjs scripts/test-pharmacy-product-source-check.cjs scripts/test-promoter-product-read-policy.cjs scripts/test-pharmacy-lot-expiry-notifications.cjs scripts/test-replay-expiry-provisioner.cjs scripts/test-replay-expiry-push-worker.cjs scripts/test-replay-expiry-stock-aggregate.cjs scripts/test-stock-lot-delete-audit.cjs scripts/test-pos-internal-stock-scope.cjs scripts/test-credit-refund-runtime.cjs scripts/test-caisse-unpublished-pharmacy-access.cjs scripts/test-credit-pharmacy-provisioner.cjs scripts/test-credit-pos-browser.cjs
      - name: Vérifier les secrets et épingler Replay
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NAXA_STORAGE_E2E_URL"
          test -n "$NAXA_STORAGE_E2E_ADMIN_KEY"
          test -n "$NAXA_STORAGE_E2E_ANON_KEY"
          case "$NAXA_STORAGE_E2E_URL" in
            https://pwfftcsjyeibxxqhwysw.supabase.co) ;;
            *) echo "::error::Ce workflow est strictement limité à NAXA Replay ; Production est refusée."; exit 1 ;;
          esac
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Créer ou reprendre le Promoteur E2E sur Replay
        if: steps.preflight.outputs.configured == 'true'
        run: node scripts/e2e/provision-replay-promoteur-safe-v2.cjs
      - name: Préparer la fixture Admin E2E existante sans exposer son secret
        if: steps.preflight.outputs.configured == 'true'
        run: node scripts/e2e/provision-replay-admin-safe.cjs
      - name: Préparer la fixture Client/Livreur via le parcours invitation sur Replay
        if: steps.preflight.outputs.configured == 'true'
        run: node scripts/e2e/provision-replay-livreur-safe.cjs
      - name: Préparer Client, Caisse, Stock, Comptable et Pharmacien sur Replay
        if: steps.preflight.outputs.configured == 'true'
        run: node scripts/e2e/provision-replay-pharmacy-staff-safe.cjs
      - name: Créer la pharmacie technique masquée et affecter le Responsable par le Promoteur
        if: steps.preflight.outputs.configured == 'true'
        run: node scripts/e2e/provision-replay-expiry-pharmacy-safe.cjs
      - name: Provisionner la Caisse et le stock du parcours crédit interne
        if: steps.preflight.outputs.configured == 'true'
        run: node scripts/e2e/provision-replay-credit-pharmacy-safe.cjs
      - name: Installer Playwright et les dépendances navigateur des recettes
        if: always() && steps.preflight.outputs.configured == 'true'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Générer un secret cron et des clés VAPID éphémères pour ce run
        if: always() && steps.preflight.outputs.configured == 'true'
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const webpush = require("web-push");
          const vapid = webpush.generateVAPIDKeys();
          const cron = crypto.randomBytes(32).toString("hex");
          fs.appendFileSync(process.env.GITHUB_ENV,
            "CRON_SECRET=" + cron + "\n" +
            "NAXA_VAPID_PUBLIC_KEY=" + vapid.publicKey + "\n" +
            "NAXA_VAPID_PRIVATE_KEY=" + vapid.privateKey + "\n",
            { encoding: "utf8", mode: 0o600 }
          );
          process.stdout.write("::add-mask::" + cron + "\n");
          process.stdout.write("::add-mask::" + vapid.privateKey + "\n");
          NODE
      - name: Construire NAXA pour le worker de notifications
        id: build
        if: always() && steps.preflight.outputs.configured == 'true'
        run: npm run build
      - name: Vérifier Google Chrome stable pour Web Push
        if: always() && steps.preflight.outputs.configured == 'true' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
      - name: Exécuter la réception Web Push réelle via Chrome stable et le worker NAXA
        id: webpush
        if: always() && steps.preflight.outputs.configured == 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # This local server is pinned to Replay by the job preflight above.
          # supabaseAdmin() deliberately refuses the legacy service-role env var
          # outside Vercel Production; explicitly map the Replay test key to the
          # helper's server-only key name for this ephemeral CI process only.
          export SUPABASE_SECRET_KEY="$NAXA_STORAGE_E2E_ADMIN_KEY"
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::La clé serveur Replay n'est pas configurée pour le worker local."
            exit 1
          fi
          echo "::add-mask::$SUPABASE_SECRET_KEY"
          NAXA_RATE_LIMIT_SECRET="$(openssl rand -hex 32)"
          export NAXA_RATE_LIMIT_SECRET
          test "${#NAXA_RATE_LIMIT_SECRET}" -ge 32
          echo "::add-mask::$NAXA_RATE_LIMIT_SECRET"
          npm run start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/naxa-webpush-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          retries=0
          while [ "$retries" -lt 60 ]; do
            retries=$((retries + 1))
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/naxa-webpush-server.log"
            exit 1
          fi
          if ! node scripts/e2e/verify-replay-expiry-webpush.cjs; then
            echo "::group::Logs serveur Next.js — diagnostic Web Push"
            cat "$RUNNER_TEMP/naxa-webpush-server.log" || true
            echo "::endgroup::"
            exit 1
          fi
      - name: Exécuter le remboursement crédit via un vrai JWT Caisse Replay
        if: always() && steps.preflight.outputs.configured == 'true'
        run: node scripts/e2e/verify-credit-refund-runtime.cjs
      - name: Recette navigateur crédit comptoir, décision Promoteur et remboursement
        if: always() && steps.preflight.outputs.configured == 'true' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_SECRET_KEY="$NAXA_STORAGE_E2E_ADMIN_KEY"
          test -n "$SUPABASE_SECRET_KEY"
          echo "::add-mask::$SUPABASE_SECRET_KEY"
          NAXA_RATE_LIMIT_SECRET="$(openssl rand -hex 32)"
          export NAXA_RATE_LIMIT_SECRET
          test "${#NAXA_RATE_LIMIT_SECRET}" -ge 32
          echo "::add-mask::$NAXA_RATE_LIMIT_SECRET"
          npm run start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/naxa-credit-pos-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          retries=0
          while [ "$retries" -lt 60 ]; do
            retries=$((retries + 1))
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/naxa-credit-pos-server.log"
            exit 1
          fi
          auth_failures=0
          browser_failures=0
          run_auth_check() {
            local script="$1"
            if node "$script"; then
              echo "::notice::$script — PASS"
            else
              echo "::error::$script — FAIL (recette Auth)"
              auth_failures=$((auth_failures + 1))
            fi
          }
          run_browser_check() {
            local script="$1"
            if node "$script"; then
              echo "::notice::$script — PASS"
            else
              echo "::error::$script — FAIL (recette crédit)"
              browser_failures=$((browser_failures + 1))
            fi
          }
          export NAXA_E2E_DIAGNOSTIC_HOLD_MS=45000
          run_auth_check scripts/e2e/verify-auth-session-lifecycle.cjs
          run_browser_check scripts/e2e/verify-credit-pos-browser.cjs
          run_browser_check scripts/e2e/verify-credit-marketplace-browser.cjs
          run_browser_check scripts/e2e/verify-credit-accounting-browser.cjs
          if [ "$auth_failures" -gt 0 ] || [ "$browser_failures" -gt 0 ]; then
            echo "::error::Résultats navigateur — Auth: $auth_failures échec(s) ; Crédit: $browser_failures échec(s)."
            exit 1
          fi
      - name: Exécuter Storage E2E avec matrices Admin et Promoteur obligatoires
        if: always() && steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          admin_password_file="$NAXA_STORAGE_E2E_ADMIN_PASSWORD_FILE"
          promoter_password_file="$NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD_FILE"
          test -s "$admin_password_file"
          test -s "$promoter_password_file"
          trap 'rm -f "$admin_password_file" "$promoter_password_file"' EXIT
          NAXA_STORAGE_E2E_ADMIN_PASSWORD="$(cat "$admin_password_file")"
          NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD="$(cat "$promoter_password_file")"
          export NAXA_STORAGE_E2E_ADMIN_PASSWORD NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD
          echo "::add-mask::$NAXA_STORAGE_E2E_ADMIN_PASSWORD"
          echo "::add-mask::$NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD"
          unset NAXA_STORAGE_E2E_ADMIN_PASSWORD_FILE NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD_FILE
          node scripts/storage-e2e.cjs
      - name: Nettoyer les fichiers de mots de passe éphémères (toujours)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -z "${NAXA_STORAGE_E2E_ADMIN_PASSWORD_FILE:-}" ] || rm -f "$NAXA_STORAGE_E2E_ADMIN_PASSWORD_FILE"
          [ -z "${NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD_FILE:-}" ] || rm -f "$NAXA_STORAGE_E2E_PROMOTEUR_PASSWORD_FILE"
          [ -z "${NAXA_STORAGE_E2E_LIVREUR_PASSWORD_FILE:-}" ] || rm -f "$NAXA_STORAGE_E2E_LIVREUR_PASSWORD_FILE"
          [ -z "${NAXA_STORAGE_E2E_EXPIRY_STOCK_PASSWORD_FILE:-}" ] || rm -f "$NAXA_STORAGE_E2E_EXPIRY_STOCK_PASSWORD_FILE"
          [ -z "${NAXA_STORAGE_E2E_EXPIRY_RESPONSABLE_PASSWORD_FILE:-}" ] || rm -f "$NAXA_STORAGE_E2E_EXPIRY_RESPONSABLE_PASSWORD_FILE"
          [ -z "${NAXA_STORAGE_E2E_CLIENT_PASSWORD_FILE:-}" ] || rm -f "$NAXA_STORAGE_E2E_CLIENT_PASSWORD_FILE"
          [ -z "${NAXA_STORAGE_E2E_CAISSE_PASSWORD_FILE:-}" ] || rm -f "$NAXA_STORAGE_E2E_CAISSE_PASSWORD_FILE"
      - name: Résultat Web Push (ne pas masquer un échec)
        if: always() && steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          if [ "${{ steps.webpush.outcome }}" != "success" ]; then
            echo "::error::Web Push a échoué. Les recettes indépendantes ont été exécutées pour éviter les faux SKIP."
            exit 1
          fi

