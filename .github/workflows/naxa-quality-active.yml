    needs: verification-8-pilotage
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la chaîne canonique des rôles
        run: |
          python - <<'PY'
          from pathlib import Path
          required=["Client","Caisse","Responsable","Promoteur","Admin"]
          text=(Path("README.md").read_text()+"\\n"+Path("STATUT.md").read_text()).lower()
          missing=[x for x in required if x.lower() not in text]
          if missing:
            raise SystemExit("Rôles absents de la documentation: "+", ".join(missing))
          print("Chaîne documentaire Client → Caisse → Responsable → Promoteur → Admin: PASS")
          PY

