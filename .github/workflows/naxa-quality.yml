name: NAXA quality
on:
  pull_request:
    branches: [main, consolidation]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-test-service-role-key
