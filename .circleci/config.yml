version: 2.1

jobs:
  part5_check:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: "Controle structurel Partie 5"
          command: |
            grep -Fq "v_priv_pharmacie := null" supabase/migration_047_network_scope_pilotage_promoteur.sql
            grep -Fq "p_scope='RESEAU'" supabase/migration_047_network_scope_pilotage_promoteur.sql
            grep -Fqi "pharmacie_id is null" supabase/tests/047_network_scope_pilotage_promoteur.sql
            grep -Fq "PART5_FAIL_NETWORK_PRIVILEGE_NOT_EFFECTIVE" supabase/tests/047_network_scope_pilotage_promoteur.sql
            grep -Fq "PART5_FAIL_SCOPE_LEAK" supabase/tests/047_network_scope_pilotage_promoteur.sql
            grep -Fq "PART5_FAIL_PROMOTEUR_SELF_GRANT_NETWORK" supabase/tests/047_network_scope_pilotage_promoteur.sql
            grep -Fq "Partie 5" README.md
            grep -Fq "Partie 5" STATUT.md
            grep -Fq "CI GitHub" STATUT.md
            echo "PART5_GATE_STRUCTURE=PASS"

  part6_check:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: "Controle structurel Partie 6"
          command: |
            grep -Fq "private.naxa_promoteur_valide_canonique" supabase/migration_048_reconciliation_finale_promoteur.sql
            grep -Fq "revoke execute on function public.synchroniser_validite_promoteurs()" supabase/migration_048_reconciliation_finale_promoteur.sql
            grep -Fq "revoke execute on function public.synchroniser_validite_pharmacies()" supabase/migration_048_reconciliation_finale_promoteur.sql
            grep -Fq "PART6_FAIL_CANONICAL_EXPIRY_IGNORED" supabase/tests/048_reconciliation_finale_promoteur.sql
            grep -Fq "PART6_FAIL_PRIVILEGE_ENGINE_IGNORES_CANONICAL_EXPIRY" supabase/tests/048_reconciliation_finale_promoteur.sql
            echo "PART6_GATE_STRUCTURE=PASS"

  part2_check:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: "Controle structurel Partie 2 — Performance"
          command: |
            grep -Fq "create view if not exists public.v_reservations_ca" supabase/migration_049_pilotage_performance_socle.sql
            grep -Fq "stats_pilotage_scope" supabase/migration_049_pilotage_performance_socle.sql
            grep -Fq "security_invoker = true" supabase/migration_049_pilotage_performance_socle.sql
            grep -Fq "PART2_FAIL_SCOPE_LEAK" supabase/tests/049_pilotage_performance_socle.sql
            grep -Fq "PART2_FAIL_CANONICAL_CA" supabase/tests/049_pilotage_performance_socle.sql
            grep -Fq "PART2_FAIL_DOUBLE_COUNT" supabase/tests/049_pilotage_performance_socle.sql
            grep -Fq "PART2_FAIL_STOCK_RUPTURE" supabase/tests/049_pilotage_performance_socle.sql
            echo "PART2_GATE_STRUCTURE=PASS"

  part2_functional:
    docker:
      - image: cimg/node:20
    resource_class: medium
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run:
          name: "Supabase CLI"
          command: npm install --global supabase
      - run:
          name: "Replay fonctionnel Partie 2"
          command: |
            cat > supabase/config.toml <<'EOF'
            project_id = "naxa-part2-circleci"
            [api]
            enabled = true
            [db]
            major_version = 17
            [studio]
            enabled = false
            [inbucket]
            enabled = false
            [storage]
            enabled = true
            [realtime]
            enabled = false
            [analytics]
            enabled = false
            [edge_runtime]
            enabled = false
            EOF
            rm -rf supabase/migrations
            mkdir -p supabase/migrations
            cp supabase/schema.sql supabase/migrations/20261006000000_base.sql
            n=1
            for f in supabase/migration_*.sql; do
              ts=$(printf '20261006%06d' "$n")
              cp "$f" "supabase/migrations/${ts}_$(basename "$f")"
              n=$((n+1))
            done
            supabase start
            supabase db reset
            supabase db query --file supabase/tests/049_pilotage_performance_socle.sql
            supabase stop

workflows:
  part2_gate:
    jobs:
      - part2_check
      - part2_functional
  part5_gate:
    jobs:
      - part5_check
  part6_gate:
    jobs:
      - part6_check
